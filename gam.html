<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stick Runner</title>
    <style>
        :root {
            --bg-top: #f7f2e6;
            --bg-bottom: #efe3ca;
            --ink: #18130d;
            --accent: #35622f;
            --dust: rgba(24, 19, 13, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255, 255, 255, 0.8), transparent 44%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--ink);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #game {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: manipulation;
            cursor: pointer;
        }

        .hud {
            position: fixed;
            top: 18px;
            left: 18px;
            right: 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            pointer-events: none;
        }

        .panel {
            padding: 12px 16px;
            border: 2px solid rgba(24, 19, 13, 0.12);
            border-radius: 18px;
            background: rgba(255, 250, 240, 0.82);
            backdrop-filter: blur(8px);
            box-shadow: 0 12px 32px rgba(24, 19, 13, 0.08);
        }

        .title {
            margin: 0 0 4px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .subtitle {
            margin: 0;
            font-size: 13px;
            color: rgba(24, 19, 13, 0.66);
        }

        .scoreboard {
            text-align: right;
            min-width: 160px;
        }

        .score-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(24, 19, 13, 0.5);
        }

        .score-value {
            display: block;
            font-size: 28px;
            font-weight: 900;
            line-height: 1;
        }

        .score-secondary {
            margin-top: 8px;
            font-size: 12px;
            font-weight: 700;
            color: rgba(24, 19, 13, 0.72);
        }

        .overlay {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            pointer-events: none;
        }

        .overlay-card {
            max-width: 420px;
            margin: 24px;
            padding: 22px 24px;
            text-align: center;
            border-radius: 24px;
            border: 2px solid rgba(24, 19, 13, 0.12);
            background: rgba(255, 249, 238, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 18px 44px rgba(24, 19, 13, 0.12);
        }

        .overlay-card h1 {
            margin: 0 0 12px;
            font-size: clamp(28px, 6vw, 44px);
            line-height: 1;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .overlay-card p {
            margin: 0;
            font-size: 15px;
            line-height: 1.6;
            color: rgba(24, 19, 13, 0.72);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="game" aria-label="졸라맨 러너 게임"></canvas>

    <div class="hud">
        <div class="panel">
            <p class="title">Stick Runner</p>
            <p class="subtitle">졸라맨으로 선인장을 넘으세요</p>
        </div>
        <div class="panel scoreboard">
            <span class="score-label">Score</span>
            <span id="score" class="score-value">00000</span>
            <div id="best" class="score-secondary">BEST 00000</div>
        </div>
    </div>

    <div class="overlay">
        <div id="message" class="overlay-card">
            <h1>Jump</h1>
            <p>스페이스, 위 방향키, 클릭, 터치로 시작하고 점프합니다.</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const messageEl = document.getElementById('message');

        const BEST_KEY = 'stick_runner_best';
        const DPR = Math.min(window.devicePixelRatio || 1, 2);

        function loadBestScore() {
            try {
                return Number(localStorage.getItem(BEST_KEY) || 0);
            } catch (error) {
                return 0;
            }
        }

        function saveBestScore(value) {
            try {
                localStorage.setItem(BEST_KEY, String(value));
            } catch (error) {
                return;
            }
        }

        const state = {
            mode: 'ready',
            width: 0,
            height: 0,
            groundY: 0,
            horizonY: 0,
            score: 0,
            best: loadBestScore(),
            speed: 440,
            distance: 0,
            obstacleTimer: 0,
            nextObstacleDelay: 0.9,
            groundOffset: 0,
            clouds: [],
            obstacles: [],
            lastTime: 0
        };

        const player = {
            x: 120,
            y: 0,
            width: 46,
            height: 74,
            vy: 0,
            jumpVelocity: -910,
            gravity: 2400,
            grounded: true,
            runCycle: 0
        };

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function resize() {
            state.width = window.innerWidth;
            state.height = window.innerHeight;
            canvas.width = Math.round(state.width * DPR);
            canvas.height = Math.round(state.height * DPR);
            canvas.style.width = `${state.width}px`;
            canvas.style.height = `${state.height}px`;
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

            state.groundY = Math.round(state.height * 0.78);
            state.horizonY = Math.round(state.height * 0.18);

            player.x = clamp(state.width * 0.16, 90, 170);
            player.height = clamp(state.height * 0.14, 58, 84);
            player.width = player.height * 0.58;
            player.y = state.groundY - player.height;

            if (!state.clouds.length) {
                for (let i = 0; i < 4; i += 1) {
                    state.clouds.push(makeCloud(true));
                }
            }
        }

        function formatScore(value) {
            return `${Math.floor(value)}`.padStart(5, '0');
        }

        function updateHud() {
            scoreEl.textContent = formatScore(state.score);
            bestEl.textContent = `BEST ${formatScore(state.best)}`;
        }

        function setMessage(title, body) {
            messageEl.innerHTML = `<h1>${title}</h1><p>${body}</p>`;
            messageEl.classList.remove('hidden');
        }

        function hideMessage() {
            messageEl.classList.add('hidden');
        }

        function makeCloud(initial = false) {
            const baseX = initial ? Math.random() * state.width : state.width + Math.random() * 120;
            return {
                x: baseX,
                y: state.horizonY + Math.random() * (state.groundY - state.horizonY - 190),
                w: 44 + Math.random() * 50,
                h: 14 + Math.random() * 8,
                speed: 26 + Math.random() * 20
            };
        }

        function spawnObstacle() {
            const height = clamp(state.height * 0.12, 58, 84);
            const width = height * 0.55;
            state.obstacles.push({
                x: state.width + width + 30,
                y: state.groundY - height,
                width,
                height
            });
            const difficultyFactor = clamp((state.speed - 440) / 220, 0, 1.4);
            state.nextObstacleDelay = 0.9 + Math.random() * 0.55 - difficultyFactor * 0.16;
            state.nextObstacleDelay = clamp(state.nextObstacleDelay, 0.58, 1.32);
            state.obstacleTimer = 0;
        }

        function resetGame() {
            state.mode = 'ready';
            state.score = 0;
            state.distance = 0;
            state.speed = 440;
            state.obstacleTimer = 0;
            state.nextObstacleDelay = 0.9;
            state.groundOffset = 0;
            state.obstacles = [];
            state.lastTime = 0;
            player.vy = 0;
            player.grounded = true;
            player.runCycle = 0;
            player.y = state.groundY - player.height;
            updateHud();
            setMessage('Jump', '스페이스, 위 방향키, 클릭, 터치로 시작하고 점프합니다.');
        }

        function startRun() {
            state.mode = 'running';
            state.score = 0;
            state.distance = 0;
            state.speed = 440;
            state.obstacleTimer = 0;
            state.nextObstacleDelay = 0.8;
            state.groundOffset = 0;
            state.obstacles = [];
            player.y = state.groundY - player.height;
            player.vy = player.jumpVelocity;
            player.grounded = false;
            player.runCycle = 0;
            hideMessage();
            updateHud();
        }

        function jump() {
            if (!player.grounded) return;
            player.vy = player.jumpVelocity;
            player.grounded = false;
        }

        function handleAction() {
            if (state.mode === 'ready') {
                startRun();
                return;
            }
            if (state.mode === 'gameover') {
                startRun();
                return;
            }
            jump();
        }

        function updatePlayer(dt) {
            player.vy += player.gravity * dt;
            player.y += player.vy * dt;

            const floorY = state.groundY - player.height;
            if (player.y >= floorY) {
                player.y = floorY;
                player.vy = 0;
                player.grounded = true;
            }

            const cycleBoost = player.grounded ? 1 : 0.22;
            player.runCycle += dt * state.speed * 0.018 * cycleBoost;
        }

        function updateClouds(dt) {
            state.clouds.forEach((cloud, index) => {
                cloud.x -= cloud.speed * dt;
                if (cloud.x + cloud.w < -20) {
                    state.clouds[index] = makeCloud(false);
                }
            });
        }

        function getPlayerHitbox() {
            return {
                x: player.x + player.width * 0.18,
                y: player.y + player.height * 0.08,
                width: player.width * 0.56,
                height: player.height * 0.88
            };
        }

        function getObstacleHitbox(obstacle) {
            return {
                x: obstacle.x + obstacle.width * 0.16,
                y: obstacle.y + obstacle.height * 0.04,
                width: obstacle.width * 0.68,
                height: obstacle.height * 0.92
            };
        }

        function intersects(a, b) {
            return (
                a.x < b.x + b.width &&
                a.x + a.width > b.x &&
                a.y < b.y + b.height &&
                a.y + a.height > b.y
            );
        }

        function triggerGameOver() {
            state.mode = 'gameover';
            state.best = Math.max(state.best, Math.floor(state.score));
            saveBestScore(state.best);
            updateHud();
            setMessage('Crash', '다시 하려면 클릭하거나 스페이스를 누르세요.');
        }

        function updateRunning(dt) {
            state.speed += dt * 12;
            state.distance += state.speed * dt;
            state.score = state.distance * 0.1;
            state.groundOffset = (state.groundOffset + state.speed * dt) % 36;

            updatePlayer(dt);

            state.obstacleTimer += dt;
            if (state.obstacleTimer >= state.nextObstacleDelay) {
                spawnObstacle();
            }

            const playerHitbox = getPlayerHitbox();
            state.obstacles = state.obstacles.filter((obstacle) => obstacle.x + obstacle.width > -40);
            state.obstacles.forEach((obstacle) => {
                obstacle.x -= state.speed * dt;
                if (intersects(playerHitbox, getObstacleHitbox(obstacle))) {
                    triggerGameOver();
                }
            });

            updateHud();
        }

        function drawSky() {
            const skyHeight = state.groundY - 30;
            const gradient = ctx.createLinearGradient(0, 0, 0, skyHeight);
            gradient.addColorStop(0, 'rgba(255,255,255,0.28)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, state.width, skyHeight);

            ctx.fillStyle = 'rgba(24, 19, 13, 0.08)';
            state.clouds.forEach((cloud) => {
                ctx.beginPath();
                ctx.ellipse(cloud.x, cloud.y, cloud.w * 0.34, cloud.h * 0.55, 0, 0, Math.PI * 2);
                ctx.ellipse(cloud.x + cloud.w * 0.25, cloud.y - cloud.h * 0.15, cloud.w * 0.3, cloud.h * 0.6, 0, 0, Math.PI * 2);
                ctx.ellipse(cloud.x + cloud.w * 0.48, cloud.y + cloud.h * 0.05, cloud.w * 0.26, cloud.h * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawGround() {
            ctx.fillStyle = '#d6c4a3';
            ctx.fillRect(0, state.groundY, state.width, state.height - state.groundY);

            ctx.strokeStyle = '#18130d';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, state.groundY + 0.5);
            ctx.lineTo(state.width, state.groundY + 0.5);
            ctx.stroke();

            ctx.fillStyle = 'rgba(24, 19, 13, 0.16)';
            const dashWidth = 18;
            const gap = 18;
            let x = -state.groundOffset;
            while (x < state.width + dashWidth) {
                ctx.fillRect(x, state.groundY + 16, dashWidth, 4);
                x += dashWidth + gap;
            }

            ctx.fillStyle = 'rgba(24, 19, 13, 0.12)';
            const pebbleCount = Math.ceil(state.width / 80);
            for (let i = 0; i < pebbleCount; i += 1) {
                const pebbleX = (i * 80 - state.groundOffset * 0.8) % (state.width + 120);
                ctx.beginPath();
                ctx.ellipse(pebbleX, state.groundY + 34 + (i % 3) * 8, 6, 2.5, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawStickRunner() {
            const x = player.x;
            const y = player.y;
            const h = player.height;
            const headR = h * 0.16;
            const shoulderY = y + h * 0.28;
            const hipY = y + h * 0.62;
            const stride = player.grounded ? Math.sin(player.runCycle) : 0.18;
            const armSwing = player.grounded ? Math.cos(player.runCycle) : -0.28;

            ctx.strokeStyle = '#18130d';
            ctx.fillStyle = '#18130d';
            ctx.lineWidth = Math.max(3, h * 0.07);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.arc(x + player.width * 0.52, y + headR + 2, headR, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(x + player.width * 0.52, shoulderY - 4);
            ctx.lineTo(x + player.width * 0.52, hipY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x + player.width * 0.16, shoulderY + armSwing * 7);
            ctx.lineTo(x + player.width * 0.52, shoulderY + 2);
            ctx.lineTo(x + player.width * 0.82, shoulderY - armSwing * 7);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x + player.width * 0.52, hipY);
            ctx.lineTo(x + player.width * (0.23 + stride * 0.12), y + h);
            ctx.moveTo(x + player.width * 0.52, hipY);
            ctx.lineTo(x + player.width * (0.82 - stride * 0.12), y + h);
            ctx.stroke();

            if (state.mode === 'gameover') {
                ctx.beginPath();
                ctx.moveTo(x + player.width * 0.42, y + headR - 2);
                ctx.lineTo(x + player.width * 0.49, y + headR + 5);
                ctx.moveTo(x + player.width * 0.49, y + headR - 2);
                ctx.lineTo(x + player.width * 0.42, y + headR + 5);
                ctx.moveTo(x + player.width * 0.56, y + headR - 2);
                ctx.lineTo(x + player.width * 0.63, y + headR + 5);
                ctx.moveTo(x + player.width * 0.63, y + headR - 2);
                ctx.lineTo(x + player.width * 0.56, y + headR + 5);
                ctx.stroke();
            }
        }

        function drawCactus(obstacle) {
            const x = obstacle.x;
            const y = obstacle.y;
            const w = obstacle.width;
            const h = obstacle.height;
            const armWidth = w * 0.26;
            const armHeight = h * 0.34;

            ctx.fillStyle = '#35622f';
            ctx.beginPath();
            ctx.roundRect(x + w * 0.36, y, w * 0.28, h, 8);
            ctx.roundRect(x + w * 0.1, y + h * 0.26, armWidth, armHeight, 8);
            ctx.roundRect(x + w * 0.64, y + h * 0.14, armWidth, armHeight, 8);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
            ctx.fillRect(x + w * 0.44, y + h * 0.1, 2.2, h * 0.74);
            ctx.fillRect(x + w * 0.18, y + h * 0.34, 1.8, armHeight * 0.56);
            ctx.fillRect(x + w * 0.74, y + h * 0.22, 1.8, armHeight * 0.58);
        }

        function drawScene() {
            ctx.clearRect(0, 0, state.width, state.height);
            drawSky();
            drawGround();
            state.obstacles.forEach(drawCactus);
            drawStickRunner();
        }

        function loop(timestamp) {
            if (!state.lastTime) state.lastTime = timestamp;
            const dt = clamp((timestamp - state.lastTime) / 1000, 0, 0.032);
            state.lastTime = timestamp;

            updateClouds(dt);
            if (state.mode === 'running') {
                updateRunning(dt);
            }

            drawScene();
            requestAnimationFrame(loop);
        }

        function handleKeydown(event) {
            if (event.code !== 'Space' && event.code !== 'ArrowUp') return;
            event.preventDefault();
            handleAction();
        }

        canvas.addEventListener('pointerdown', (event) => {
            event.preventDefault();
            handleAction();
        });

        window.addEventListener('keydown', handleKeydown);
        window.addEventListener('resize', () => {
            resize();
            updateHud();
            drawScene();
        });

        resize();
        updateHud();
        resetGame();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
