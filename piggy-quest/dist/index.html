<body>
<div class="shell">
<header class="site-header">
  <button class="brand" id="brand" aria-label="저금통 원정대 홈"><span class="brand-mark">🐷</span><span><strong>저금통 원정대</strong><small>P I G G Y &nbsp; Q U E S T</small></span></button>
  <nav aria-label="홈 메뉴"><button data-view="camp" class="active">캠프</button><button data-view="helpers">조수 모음집</button><button data-view="skills">기술 배우기</button><button data-view="bag">가방 · 치료</button></nav>
  <div class="header-tools"><span class="bank" title="홈에 안전하게 보관한 코인"><span>◉</span> <b id="bank-value">120</b></span><button class="source-link" id="source-btn"><span>&lt;/&gt;</span> 소스코드</button></div>
</header>
<main>
  <section class="stage" id="stage" aria-label="저금통 원정대 게임 화면">
    <canvas id="game" width="1280" height="720" tabindex="0" aria-label="A D 이동, J 펀치, K 발차기, E 상호작용, Q 조수 명령, ESC 일시정지"></canvas>
    <div class="hero" id="hero">
      <div class="hero-copy"><p class="eyebrow"><span></span> A LITTLE PIG. A BIG ADVENTURE.</p><h1>작은 저금통과<br><em>커다란 모험.</em></h1><p class="lead">길을 찾고. 동료를 만나고. 저금통을 지켜주세요.<br>당신의 첫 번째 원정이 시작됩니다.</p><p class="home-vitals" id="home-vitals"></p><button id="depart" class="primary hero-action">탐험 떠나기 <span>↗</span></button><button class="text-link" data-view="bag">출발 전, 체력을 확인하세요 <span>→</span></button></div>
      <button id="map-select" class="next-map"><b id="map-number">01</b><span><small>NEXT ADVENTURE</small><strong id="map-label">바람숲</strong></span><i>→</i></button>
      <p class="camp-caption">◦ &nbsp; 바람이 머무는 캠프<small>우리의 모험은 여기서부터.</small></p>
      <div class="hero-foot">● 브라우저에 자동 저장 <span>/</span> 로그인 없는 오프라인 모험</div>
    </div>
    <div class="game-ui" id="game-ui" hidden>
      <div class="health-box"><div><span class="health-symbol">◯</span><label>나의 체력 <small id="player-health-text"></small><progress id="player-health" max="100" value="100"></progress></label></div><div><span class="health-symbol">🐷</span><label>저금통 <small id="pig-health-text"></small><progress id="pig-health" class="pink" max="180" value="180"></progress></label></div></div>
      <button class="quest-pill" id="world-map"><strong id="room-label">바람숲 · 큰길</strong><span id="kill-count">0 / 24 처치　⌘</span></button>
      <div class="game-top-right"><div class="run-money"><span>◉</span><label>이번 원정<b id="run-coins">0</b></label></div><button id="pause" class="pause-btn" aria-label="일시정지">☰</button></div>
      <button id="command" class="command-pill">● 조수 · 따라오기 <kbd>Q</kbd></button>
      <div class="movement"><button data-hold="a" aria-label="왼쪽 이동">‹</button><button data-hold="d" aria-label="오른쪽 이동">›</button><button id="jump-btn" data-action="jump" aria-label="뛰기">↟<small>뛰기</small></button></div>
      <div class="skills-pad" id="skills-pad"></div>
      <div class="combat"><button data-action="interact"><kbd>E</kbd><span id="carry-icon">↥</span><small id="carry-label">들기 · 사용</small></button><button data-hold="j" id="punch-btn"><kbd>J</kbd><span>✧</span><small>펀치</small></button><button data-hold="k" id="kick-btn" class="kick"><kbd>K</kbd><span>↗</span><small>발차기</small></button></div>
      <div class="progress-track"><i id="distance-progress"></i></div>
    </div>
    <div id="loading" class="loading"><span class="brand-mark">🐷</span><p>원정 가방을 챙기는 중…</p></div>
  </section>
  <nav class="mobile-nav" aria-label="모바일 홈 메뉴">
    <button data-view="camp" class="active">캠프</button>
    <button data-view="helpers">조수 모음집</button>
    <button data-view="skills">기술 배우기</button>
    <button data-view="bag">가방 · 치료</button>
  </nav>
</main>
<footer><div><span class="live-dot"></span> 원정대 기록 <span class="muted">v0.3.0</span><span class="separator">·</span><button id="help">조작법 · 게임 규칙</button><button id="save-tools">저장 관리</button><button id="new-game">처음부터 시작</button></div><div class="footer-controls"><span>이동 A D · 펀치 J · 발차기 K · 상호작용 E</span><button id="sound" aria-label="효과음 켜기">♪</button><button id="fullscreen" aria-label="전체 화면">⛶</button></div></footer>
<p class="rotate-hint">휴대전화는 가로로 돌리면 더 넓게 탐험할 수 있어요.</p>
</div>
<dialog id="modal" aria-labelledby="modal-title"><div id="modal-body"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
globalThis.PIGGY=globalThis.PIGGY||{};globalThis.PIGGY.SOURCE_FILES={"AGENTS.md":"# Agent instructions for Piggy Quest\n\nRead HANDOFF.md and docs/GAME_DESIGN.md before changing mechanics.\nDo not replace the game with a static mockup, plan, or screenshot.\nPreserve the Korean UI and pale sage / ivory / pig-pink visual direction.\n\n## Invariants\n\n- Safe bank coins and risky run coins are distinct. Player death keeps run coins. Pig death loses run coins ONLY.\n- Settlement happens once. No replayed death event, resume or rendering callback may duplicate currency.\n- Killed monsters and opened chests remain cleared on return, player death, reload, and re-entry.\n- A completed map resets only on an explicit replay action. Never delete another map or owned helpers.\n- Every regular monster must be defeated before spawning the deepest boss.\n- No required enemy may be locked behind an unpurchased movement ability.\n- While carrying the pig overhead, punches, fire punches and guns are blocked; kick stays usable.\n- Companion revival = 10 SIMULATION seconds, at 50% of maximum HP, at the pig.\n- Pause, source viewer, inventory dialogs, map dialogs and hidden tabs must freeze combat and revival.\n- Home does not automatically heal. Player AND pig need >=1 HP to start.\n- Source export is public project files only. Never include local saves, .env, tokens or private attachments.\n- Do not claim a live deployment without actually invoking an authorized deployment tool and verifying the returned URL.\n\n## Structure\n\nsrc/config.js: all balance data and stable IDs.\nsrc/state.js: schema, persistent rules, normalization, purchases and settlement.\nsrc/art.js: scenery, replaceable SVG assets and stick-figure joint poses.\nsrc/game.js: fixed-step simulation and world rendering.\nsrc/ui.js: modals, treatment, shops, source workspace, save import/export.\nsrc/export.js: client-only ZIP and text exports.\nsrc/main.js: entrypoint, input and lifecycle.\nscripts/build.py: offline single-file builder and source manifest generator.\n\n## Validate\n\nRun npm test, python scripts/build.py and browser smoke tests.\nServe with npm start; optional browser suite needs Python Playwright and Chromium.\nTest both HTTP directory mode and file:// dist/index.html.\nUpdate HANDOFF.md and TEST_REPORT.md honestly, distinguishing automated tests from untested assumptions.\n","CODEX_PROMPT.md":"첨부한 Piggy Quest 전체 소스 ZIP을 실제 프로젝트로 열어 이어서 개발해 주세요.\n단순한 시안/설명/새 기획서를 만드는 작업이 아니라 현재 실행되는 게임을 유지·개선하는 작업입니다.\n\nAGENTS.md → HANDOFF.md → docs/GAME_DESIGN.md → docs/TEST_REPORT.md 순서로 읽으세요.\n먼저 npm test와 npm start로 동작을 확인하고 발견한 문제를 고쳐 주세요.\n저금통 호위·체력·코인 정산·10초/50% 조수 부활·중도 귀환 진행 유지 규칙은 보존하세요.\n공개 소스 보기/전체 ZIP/파일 복사/인수인계 문서 버튼도 계속 작동해야 합니다.\n\n우선순위는 졸라맨의 자연스러운 관절 움직임과 타격감, 몬스터 최종 에셋,\n구역 전환식 샛길을 실제 상하 지형과 숨겨진 통로로 확장하는 것입니다.\n필수 몬스터가 미구입 능력 때문에 접근 불가능해지는 구조는 만들지 마세요.\n\n수정 후 python scripts/build.py로 단일 게시용 dist/index.html을 다시 만드세요.\n실제 ChatGPT Sites 게시 도구가 제공된다면 이 게임을 chatgpt.site에 게시하고\n생성된 URL에서 게임과 소스 ZIP 버튼까지 검증해 주세요.\n도구가 없다면 배포했다고 말하거나 주소를 추정하지 마세요.\n모든 소스·기획·테스트를 유지하고 비밀키와 개인 저장 기록은 공개 파일에서 제외하세요.\n","HANDOFF.md":"# Codex 인수인계 · 저금통 원정대 v0.3.0\n\n## minsung 통합 · 2026-10-04\n\n첨부된 v0.2.0을 `piggy-quest/`에 통합한 뒤 사용자 요청에 따라 v0.3.0으로 개선했습니다.\n상위 저장소 대시보드에서 로그인 없이 실행할 수 있으며 정산·운반·부활 규칙은 유지합니다.\n현재 Cloudflare Pages 배포 방법과 버전별 결과는 상위 저장소\n`docs/piggy-quest-integration.md`를 확인하세요.\n실제 HTTP 원점에서 이동, localStorage 새로고침 복원, 소스 ZIP 다운로드를 검증했습니다.\n파일 원점 이동은 VM 브라우저 정책으로 차단되어 검증하지 못했습니다.\n\n## 1. 현재 상태\n\n계획서만 있는 것이 아니라 실행·전투·귀환·성장·소스 내보내기가 연결된 브라우저 게임입니다.\n전 대화에서 만들어진 실행 소스는 현재 작업 환경/파일 검색에서 발견되지 않았습니다.\n남은 테스트 화면 이미지의 배치·분위기와 사용자 확정 규칙을 바탕으로 다시 작성한 코드입니다.\n공개 경로는 https://minsung.pages.dev/piggy-quest/ 입니다.\nChatGPT Sites 게시 도구가 제공되지 않아 chatgpt.site 배포는 수행하지 않았습니다.\n\nv0.3.0은 성인 비율의 긴 다리, 좁은 기본 발 간격, 이동 거리 기반 발 접지와 어깨 팔 흔들림,\n좌우 교대 펀치(55/215ms), 빠른 발차기(45ms 최대 확장·220ms 회수 완료)를 적용합니다.\n흙길 중앙 ground=600, roadTop=550, roadBottom=650이며 배경 오브젝트 ID는 월드에 고정됩니다.\n전체 텍스트 선택을 막되 소스 복사·다운로드 단추는 유지합니다.\n홈 하단·일시정지의 '처음부터 시작'은 확인 후 저장 JSON 백업 다운로드와 전체 진행 초기화를\n수행합니다. 설정은 유지하며 취소하면 기존 원정을 계속합니다.\n물안개 길과 두 샛길, 고유한 황혼/물안개 보스, 피할 수 있는 경고·충격파를 추가했습니다.\n\n## 2. 가장 먼저\n\n1. `npm test`로 저장·경제·부활 등의 규칙을 확인합니다.\n2. `npm start`로 실행한 뒤 캠프와 첫 전투를 직접 확인합니다.\n3. 게임 오른쪽 위 소스코드 버튼에서 읽기·복사·ZIP 저장을 확인합니다.\n4. 수정한 뒤 `python scripts/build.py`를 실행해 단일 파일과 소스 보기 내용을 갱신합니다.\n5. 실제 게시 권한이 있는 환경에서 배포하고 반환된 URL의 실행까지 확인합니다.\n\n## 3. 실제 들어간 기능\n\n좌우 이동 / 두 번 펀치 / 발차기 밀어내기 / 재사용 시간 / 저금통 운반 /\n몬스터 화면 진입 감지 / 체력·피격 / 바닥 코인·저금통 흡입·통통 연출 /\n위험 경고 / 조수 따라오기·지키기 / 조수 10초·50% 부활 /\n귀환 시 체력 유지 / 치료·수리 드래그 또는 클릭 / 상점 /\n발견 조수 즉시 보유 / 기본 1명·최대 3명 동행 /\n6종 기술 구입·강화·3개 장착 / 큰길과 연결된 별도 샛길 구역 /\n남은 몬스터 확인 / 모든 일반 적 처치 후 보스 / 클리어·다음 맵·재도전 /\n일시정지 / 저장·복구 / 공개 소스 보기·텍스트 복사·파일 저장·전체 ZIP.\n\n## 4. 1차 구현을 위해 정한 잠정 사항\n\n사용자가 직접 확정하지 않은 아래 값은 변경 가능한 기본값입니다.\n- 시작 코인 120, 치료제 3, 수리도구 2, 첫 조수 새싹 1명 지급.\n- 뛰기=점프로 해석. 기본 좌우 이동은 무료이며 점프는 구입합니다.\n- 특수 기술은 3개 장착. 뛰기는 별도 스페이스 키.\n- 조수 동행은 최대 3명. 구매 비용 300/600.\n- 치료제 +50, 수리도구 +80. 가격 30/45.\n- 저금통을 내려놓고 멀리 떠나지 못하도록 좌우 약 470 단위의 이동 제한.\n  이 제한은 '저금통은 화면에 보이는 곳에만 놓는다'를 안전한 기본값으로 구현한 것입니다.\n- 원정에서 발견한 조수는 바로 보유하지만 출전 조수 변경은 홈에서만 합니다.\n- 사망 후 재입장은 해당 구역 시작점. 자발적 귀환 후에는 저장한 위치에서 이어갑니다.\n- 저금통 파괴도 처치 기록을 지우지 않고 이번 원정 코인만 잃습니다.\n- 상자 물건과 발견 조수는 저금통 파괴로 사라지지 않습니다.\n- 중복 조수는 맵 재도전 시 다시 나타나지 않습니다. 상자는 재생성됩니다.\n- 플레이어/저금통의 체력이 0이고 치료 수단과 코인이 전혀 없을 때만,\n  홈의 '긴급 보급' 버튼으로 필요한 소모품 1개를 제공합니다. 시험판 진행 막힘 방지용입니다.\n- 일반 적 24/20/22마리와 각 보스 수치는 시험용 균형입니다.\n\n## 5. 다음 개발의 우선순위\n\n### A. 움직임 완성도\nsrc/motion.js의 고정 길이 관절과 발 접지를 기반으로 무게중심·동작 전환·피격 반응을 개선하세요.\n걷기·공격·운반·공중·피격 포즈는 절차적으로 생성됩니다. 이번 수정의 동작 검사는\ntests/motion.test.cjs와 상위 tests/piggy-quest-revision-browser.py를 확인하세요.\nAlan Becker 원작 캐릭터·장면·프레임을 복사하지 말고 독자적인 원화와 동작을 제작합니다.\n현재 수준을 최종 영상급 애니메이션이라고 소개하지 마세요.\n\n### B. 최종 에셋\nassets/*.svg는 코드로 그린 임시 벡터 디자인입니다. 생성 이미지가 아닙니다.\n최종 몬스터 원화/관절 분리 이미지 또는 일관된 스프라이트 시트를 별도 제작하세요.\nassets/manifest.json에 출처·규격·앵커·애니메이션 정보를 기록한 뒤 교체하세요.\n보스 2·3은 고유 SVG와 경고 후 충격파를 사용합니다. 공격 종류·연출은 더 확장할 수 있습니다.\n\n### C. 맵 지형\n현재는 세 맵의 평평한 길과 구역 전환식 갈림길입니다. 다층 배경과 구역별 랜드마크를 사용합니다.\n실제 위/아래 갈림길, 발판 충돌, 점프 높이에 따른 선택 경로, 비밀 벽은 확장 과제입니다.\n필수 몬스터는 구입하지 않은 점프·날기 뒤에 두지 마세요.\n\n### D. 운영\n현재는 로컬 저장이며 서버 동기화·로그인·보안 검증 경제는 없습니다.\n공개 서비스에서 순위/거래 등을 추가할 경우 서버 권한 검증을 새로 설계해야 합니다.\n공유된 정적 소스에는 API 키나 저장 파일을 절대 넣지 마세요.\n\n## 6. 저장 구조\n\n키: piggy-quest-save-v2, schema=2.\nplayer/pig 현재·최대 체력, 안전 coins, 위험 runCoins, helpers·party·revive,\nskills·equipped, maps별 dead/opened/drops/room/x/pigX/carrying/cleared/visited.\n서버는 없습니다. 같은 schema=2의 v0.2 저장은 ID·코인·진행을 보존하며 새 맵 기본값을\n추가합니다. 기존 노을 폐허 완료 기록은 물안개 길을 자동 개방합니다. schema가 다른 저장은\n자동으로 옮기지 않습니다.\n살아 있는 몬스터의 부상 체력과 활성 추격 상태는 방/세션 재입장 시 초기화합니다.\n처치 여부·상자·코인 드롭은 유지하므로 처치 보상 중복은 방지합니다.\n\n## 7. 인계 파일\n\nREADME.md: 실행·조작.\nAGENTS.md: 변경하면 안 되는 핵심 규칙.\ndocs/GAME_DESIGN.md: 기획 정본.\ndocs/ARCHITECTURE.md: 구조와 저장 경계.\ndocs/TEST_REPORT.md, docs/test-results.json: 실제 확인 결과.\ndocs/DEPLOYMENT.md: 현재 공개 경로와 게시용 산출물.\nCODEX_PROMPT.md: 새 코덱스에 바로 붙일 전달문.\n","README.md":"# 저금통 원정대 · Piggy Quest\n\n**v0.3.0 / 2026-10-04 / 동작·맵 확장**\n\n돼지 저금통을 데리고 왼쪽에서 오른쪽으로 넓은 맵을 탐험하는 졸라맨 액션 게임입니다.\n배경은 다층 시차 이동을 사용하고 캐릭터는 관절 애니메이션으로 움직입니다.\n이전 대화의 실행 소스는 복구되지 않아, 남아 있는 화면 이미지와 확정 규칙을 바탕으로 재구성했습니다.\n최종 상용 게임 또는 최종 애니메이션 완성본이라는 뜻은 아닙니다.\n\n## 바로 실행\n\n- 단일 파일 `dist/index.html`을 브라우저로 열면 실행됩니다. 전달용 `Piggy_Quest.html`과 같은 내용입니다.\n- 폴더형 소스는 `index.html`을 직접 열거나 `npm start`로 로컬 서버를 실행합니다.\n- 로컬 서버 주소: `http://127.0.0.1:4173`.\n- 게임 실행에는 인터넷, 회원 가입, API 키, npm 설치가 필요하지 않습니다.\n\n## 소스 보기와 개발 인수인계\n\n게임 오른쪽 위의 **소스코드**를 누르면 전체 소스를 파일별로 볼 수 있습니다.\n**전체 소스 ZIP**, **내용 복사**, **파일 저장**, **코덱스 전달문 복사**가 있습니다.\n압축 파일에는 수정할 원본 코드·벡터 에셋·테스트·빌드 스크립트·기획 문서가 들어갑니다.\n진행 저장과 개인정보는 소스에 넣지 않습니다. 내 저장은 **저장 관리**에서 별도로 내보냅니다.\n\n다른 개발 세션에서는 `AGENTS.md` → `HANDOFF.md` → `docs/GAME_DESIGN.md` 순서로 읽으세요.\n\n## 조작\n\n| 조작 | 기능 |\n| --- | --- |\n| A/D 또는 좌우 방향키 | 이동 |\n| J | 두 번 펀치, 0.5초 재사용, 길게 누르면 반복 |\n| K | 밀어내는 발차기, 1초 재사용, 길게 누르면 반복 |\n| E | 저금통 운반 / 내려놓기 / 상자 / 샛길 / 발견한 조수 |\n| Q 또는 저금통 클릭 | 조수 따라오기 ↔ 저금통 지키기 |\n| 스페이스 | 구매한 뛰기 |\n| 1/2/3 | 장착한 특수 기술 |\n| M | 구역별 남은 몬스터 확인 |\n| ESC 또는 ☰ | 일시정지 |\n\n## 이번 버전\n\n바람숲: 큰길 + 두 샛길, 일반 몬스터 24마리, 보스 1마리, 상자 4개, 발견 조수 1명.\n노을 폐허: 큰길 + 샛길, 일반 몬스터 20마리, 고유 보스 1마리. 첫 맵 클리어 후 열립니다.\n물안개 길: 큰길 + 샘터·물레방앗간, 일반 몬스터 22마리, 고유 보스 1마리, 상자 4개.\n노을 폐허를 클리어하면 열립니다. 새 두 보스는 경고 후 충격파를 보냅니다.\n기존 구역에 속 빈 나무·돌 아치·다리·연못·결정 등을 추가했습니다.\n조수 4종, 출전 최대 3명, 구매·강화 가능한 추가 기술 6종을 포함합니다.\n\n다리를 성인 비율로 늘리고 발 접지·어깨부터 흔드는 팔·좌우 교대 펀치·빠른 발차기를\n적용했습니다. 캐릭터는 흙길 중앙에 서며 배경은 고정된 월드 좌표를 따라 움직입니다.\n터치 중 텍스트 선택을 막고, 홈 하단과 일시정지 메뉴에 **처음부터 시작**을 추가했습니다.\n확인 후 기존 저장 JSON 백업을 내려받고 진행을 초기화합니다. 취소하면 기록을 유지합니다.\n\n## 저장\n\n이 브라우저의 `localStorage`에 자동 저장합니다. 서버·계정·클라우드 저장은 없습니다.\n다른 브라우저, 다른 기기, 다른 사이트 주소로 저장은 자동 이동하지 않습니다.\n한 탭에서 플레이하세요. 공개 소스와 개인 저장은 반드시 분리합니다.\n개인 기록은 저장 관리의 JSON 내보내기·불러오기로 이동할 수 있습니다.\n불러오기 전 기존 기록을 파일로 자동 백업하며 확인을 받습니다.\n\n## 개발 명령\n\n```sh\nnpm test\nnpm start\npython scripts/build.py\n```\n\nPython 빌드는 추가 패키지가 필요하지 않습니다. `npm run build`도 같은 동작입니다.\n`dist/index.html`이 단일 게시 파일입니다. 원본을 수정한 뒤 반드시 빌드해서 소스 보기 내용도 갱신하세요.\n\n## 게시 상태\n\n공개 게임: https://minsung.pages.dev/piggy-quest/\nCloudflare Pages의 기존 첫 화면을 보존하고 게임 경로만 추가했습니다.\n버전별 배포 결과는 상위 저장소 `docs/piggy-quest-integration.md`에 기록합니다.\nChatGPT Sites 게시 도구는 이 환경에 제공되지 않아 `*.chatgpt.site` 배포는 수행하지 않았습니다.\n게시용 단일 파일과 절차는 `docs/DEPLOYMENT.md`를 확인하세요.\n\n## 한계와 다음 작업\n\n현재 그림은 원본 코드로 만든 SVG 시험 에셋이며 최종 제작 이미지가 아닙니다.\n졸라맨은 관절 보간 기반입니다. Alan Becker 영상 수준의 연출·작화가 검증되었다는 뜻이 아닙니다.\n상세 한계, 잠정 규칙, 실제 테스트 결과는 `HANDOFF.md`와 `docs/TEST_REPORT.md`를 확인하세요.\n","assets/bat.svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 80\">\u003cdefs>\u003clinearGradient id=\"p\" x2=\"0\" y2=\"1\">\u003cstop stop-color=\"#f4c3c0\"/>\u003cstop offset=\"1\" stop-color=\"#df95a7\"/>\u003c/linearGradient>\u003clinearGradient id=\"s\" x2=\"0\" y2=\"1\">\u003cstop stop-color=\"#c8d993\"/>\u003cstop offset=\"1\" stop-color=\"#91b26d\"/>\u003c/linearGradient>\u003c/defs>\u003cpath d=\"M40 37Q22 11 3 22Q7 44 18 55L22 43L35 (#s)\" stroke=\"#5e854e\" stroke-width=\"3\"/>\u003cpath d=\"M27 36q4-10 13-10\" fill=\"none\" stroke=\"#e3e7b6\" stroke-width=\"5\" stroke-linecap=\"round\"/>\u003cellipse cx=\"36\" cy=\"53\" rx=\"3.3\" ry=\"5\" fill=\"#37594d\"/>\u003cellipse cx=\"63\" cy=\"53\" rx=\"3.3\" ry=\"5\" fill=\"#37594d\"/>\u003cpath d=\"M45 62q5 5 10 0\" fill=\"none\" stroke=\"#37594d\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\u003ccircle cx=\"28\" cy=\"61\" r=\"5\" fill=\"#d1c591\"/>\u003ccircle cx=\"71\" cy=\"61\" r=\"5\" fill=\"#d1c591\"/>\u003c/svg>","docs/ARCHITECTURE.md":"# Architecture\n\n## Runtime\n\nNo framework, CDN or server is required. Namespace `globalThis.PIGGY` connects plain scripts.\nconfig → motion/state → art/audio → game → export → ui → main.\nCanvas logical resolution is 1280×720. Device-pixel ratio is capped at 2.\nGame simulation uses 1/60 second steps, capped frame accumulation after inactive periods.\nAll damage, attacks, projectiles, knockback, invulnerability and revival use simulation delta.\nThe only wall-clock timeouts are notifications and revoking generated download URLs.\n\n## Visuals\n\nBackground: forest/ruins/brook layers, fixed world feature IDs, independent parallax factors,\nforeground rocks and per-room landmarks. Camera changes do not reseed shapes.\nActors: fixed-length joint rigs from motion.js, distance-driven planted feet, counter-swinging\nshoulders, alternating punches and 45ms snap kicks; separate carry/air/hit poses.\nAll ground actors stand at y=600, the midpoint of the visible 550–650 dirt road.\nMonsters/items: original SVG files as Image objects, with transform-based bounce/wing/attack feedback.\nChanging final art does not require changing enemy balance data.\n\n## Save boundary\n\nState rules contain all serializable progression. The game snapshots player/pig position and HP.\nMap IDs and enemy/chest IDs are stable. Live room enemies are filtered using saved dead IDs.\nSchema 2 saves add default progress for new maps and unlock the successor of already cleared maps.\nUncollected coins persist in drops. Chest opening and enemy death are persisted immediately.\nPeriodic snapshots run about every 0.8 simulation seconds; pagehide/visibility suspend also snapshot.\nSame-origin localStorage does not provide account security or multi-device synchronization.\n\n## Money boundary\n\n`coins`: safe, spendable at home. `runCoins`: risky current expedition money.\n`settle(reason)` clears runCoins immediately and then banks the permitted amount.\nA successful clear sweeps outstanding drops only once. A defeat does not sweep floor coins.\n\n## Build/source boundary\n\nscripts/build.py allowlists root project files and src/assets/scripts/tests/docs text files.\nIt writes source-bundle.js and inlines CSS, sources and manifest into dist/index.html.\nPublic source view uses textContent, not untrusted innerHTML. JSON escapes `\u003c` on embedding.\nThe client ZIP writer implements stored ZIP entries, CRC32 and UTF-8 filenames without dependencies.\nThe ZIP exporter regenerates source-bundle.js to make an exported directory runnable.\nNo personal localStorage values are ever read by the source exporter.\nPersonal save export is a separate explicit user action.\n\n## Extending\n\nAdd maps/enemies/helpers/skills in src/config.js using new stable IDs.\nAdd save schema migrations before changing an existing ID or incompatible state shape.\nKeep obligatory enemies reachable using free movement; optional upper rewards may need learned skills.\nAny backend leaderboard/trading/online account work is new scope, not already supported.\n","docs/DEPLOYMENT.md":"# 게시용 구성과 현재 상태\n\n**공개 경로: https://minsung.pages.dev/piggy-quest/**\n기존 Cloudflare Pages 프로젝트에 추가했으며 원래 첫 화면은 보존합니다.\n버전별 커밋·배포 ID·HTTP 검증은 상위 `docs/piggy-quest-integration.md`에 기록합니다.\nChatGPT Sites 게시 도구가 이 환경에 제공되지 않아 chatgpt.site 주소는 없습니다.\nVM Chromium의 공개 HTTPS 검사는 CA 신뢰 문제로 제한됩니다. 시스템 CA 신뢰 DB 변경은\n자동 승인 검토가 거부했습니다. TLS 검증을 끄지 않고 로컬 HTTP 기능 검사와 공개 HTTPS\n파일 해시 비교를 구분해 기록합니다.\n\n## 게시할 파일\n\n`python scripts/build.py` → `dist/index.html`\n\n이 한 파일에 게임 코드, 스타일, SVG 에셋, 파일별 소스 보기,\n전체 소스 ZIP 내보내기, 인수인계 문서가 포함됩니다.\n정적 HTML과 JavaScript 실행이 허용되는 웹 환경에서 사용할 수 있습니다.\n빌드한 결과가 크므로 코드 일부만 복사하지 말고 파일 전체 또는 전체 소스 ZIP을 전달하세요.\n\n## ChatGPT Sites를 사용할 수 있는 다음 작업 환경\n\n전체 소스 ZIP 또는 단일 실행 HTML과 CODEX_PROMPT.md를 첨부하세요.\n해당 환경에서 실제 제공되는 Sites 생성/게시 도구로 배포하도록 요청하세요.\n게시 여부와 공유 범위는 실제 게시 인터페이스에서 확인해야 합니다.\n이 문서는 Sites 공개 API나 파일 가져오기 메뉴가 항상 존재한다고 가정하지 않습니다.\n\n공식 제품 안내를 확인한 출처:\n- https://help.openai.com/en/articles/20001339-creating-and-using-chatgpt-sites\n- https://chatgpt.com/features/sites/\n확인일: 2026-10-04. 현재 대화에서 게시를 수행했다는 근거가 아닙니다.\n\n## 게시 후 점검\n\n홈이 로딩되는지, 새 원정/이동/전투/귀환/치료가 동작하는지 확인합니다.\n사이트 안에서 소스코드 → 전체 ZIP을 내려받고 압축을 풀어 다시 실행합니다.\n모바일 가로 화면에서 이동과 공격 버튼을 동시에 누릅니다.\n브라우저 보안 정책으로 Blob 다운로드 또는 파일 저장이 제한되는지 확인합니다.\n제한이 있다면 실제 소스 ZIP 파일을 배포 폴더에 두고 다운로드 경로를 연결해야 합니다.\n\n## 금지\n\n.env, API 키, 학생 자료, 사용자 개인 저장 JSON을 게시 파일에 넣지 않습니다.\n서버·DB·로그인 기능을 이미 지원한다고 설명하지 않습니다.\n사이트 URL 발급 및 HTTP/브라우저 확인 전에는 배포 완료로 보고하지 않습니다.\n","docs/GAME_DESIGN.md":"# 게임 기획 정본\n\n## 모험의 형태\n\n플레이어는 졸라맨이며 돼지 저금통을 지키면서 넓은 맵을 탐험하고 몬스터를 처치합니다.\n화면은 옆에서 보며 기본 진행은 왼쪽에서 오른쪽입니다. 배경·오브젝트에는 깊이감이 있어야 합니다.\n몬스터는 맵에 분산되어 혼자 또는 무리로 있고 플레이어 화면에 보이면 접근합니다.\n맵에는 갈림길과 숨겨진 길이 있으며 가장 깊은 곳의 보스를 잡아야 클리어합니다.\n보스전의 조건은 해당 맵의 모든 일반 몬스터 처치입니다.\n\n## 플레이어\n\n체력바가 있습니다. 기본 기술은 펀치와 발차기입니다.\n펀치는 좌우 팔을 번갈아 가장 가까운 적을 두 번 때리며 약 0.5초 뒤 재사용합니다.\n각 주먹의 최대 확장·피해 시점은 55ms와 215ms입니다.\n발차기는 45ms에 빠르게 뻗어 가까운 적에게 피해를 주고 밀어내며 220ms까지 회수합니다.\n재사용 시간은 약 1초입니다. 걷기는 좁은 기본 자세에서 발 접지와 어깨 팔 흔들림을 사용합니다.\n죽으면 홈으로 돌아오고 코인은 유지됩니다. 체력 0이면 치료해서 1 이상 채워야 재출전합니다.\n추가 기술: 뛰기, 돌려차기, 불 펀치, 돌진, 날기, 총. 코인으로 구입·강화합니다.\n\n## 저금통\n\n별도 체력바. 머리 위로 들어 운반하고 내려놓을 수 있습니다.\n운반 중에는 손을 사용하는 공격을 하지 못하지만 발차기는 가능합니다.\n화면에 보이는 장소에만 놓습니다. 근처 적 접근 시 경고합니다.\n맞을 때마다 화면이 매우 옅게 붉은색으로 깜빡입니다.\n체력이 0이 되면 패배하고 이번 원정의 위험 코인은 잃습니다.\n홈에 보관한 안전 코인은 잃지 않습니다. 전용 수리도구로 수리합니다.\n\n## 코인\n\n적을 처치하면 바닥에 떨어집니다. 플레이어가 위로 걸어가야 수집합니다.\n코인이 저금통으로 날아가 들어가고 저금통이 통통 뜁니다.\n기본 화면과 일시정지 화면에서 현재 원정 코인을 확인합니다.\n일시정지 후 홈으로 귀환하면 원정 코인을 보유 코인으로 옮깁니다.\n원정 코인/홈 코인의 구분은 화면·저장·정산에서 일치해야 합니다.\n\n## 조수\n\n모든 조수는 졸라맨이고 외형·기술·가격이 서로 다릅니다.\n여러 명을 소유할 수 있으나 기본 동행은 1명입니다. 코인으로 출전 인원을 늘립니다.\n평소에는 플레이어를 따라다니며 자동 전투합니다.\n게임 중 저금통을 누르면 저금통 주변을 지키게 합니다. 다시 따라오도록 바꿀 수 있어야 합니다.\n조수에도 체력바가 있습니다. 죽으면 10초 후 저금통에서 최대 체력의 50%로 부활합니다.\n일시정지 중에는 그 10초도 흐르면 안 됩니다.\n\n## 홈\n\n플레이어·조수의 모습과 현재 체력을 봅니다. 귀환해도 자연 회복하지 않습니다.\n코인으로 치료제를 사서 캐릭터에게 끌어다 놓아 치료합니다. 저금통은 전용 수리도구를 사용합니다.\n조수 모음집, 동행 선택, 기술 구입·강화, 맵 선택이 연결됩니다.\n\n## 진행과 보상\n\n중도 귀환 후 같은 미완료 맵을 들어가면 처치한 적이 다시 나오지 않습니다.\n클리어한 맵의 다시 플레이는 처음부터 시작합니다.\n숨겨진 길에는 평범한 모습의 보물상자와 수집 가능한 조수가 있습니다.\n상자에 희귀도 외형은 없으며 열면 코인 100개·치료제 2개 같은 내용물을 표시합니다.\n보스를 처치하면 맵이 끝나고 다음 맵이 열립니다.\n바람숲(24마리) → 노을 폐허(20마리) → 물안개 길(22마리) 순서입니다.\n각 맵은 큰길과 1~2개의 샛길, 상자, 구역 랜드마크와 보스를 포함합니다.\n노을/물안개 보스의 충격파는 경고 후 퍼지고 일시정지 동안 멈춥니다.\n흙길 중앙으로 플레이어·조수·몬스터의 접지를 맞추며 배경의 모양은 월드 좌표에 고정합니다.\n\n홈 하단과 일시정지의 '처음부터 시작'은 전체 코인·조수·기술·맵 진행을 초기화합니다.\n사용자가 확인하기 전에는 유지하며 확인 시 기존 저장 JSON을 먼저 내려받습니다.\n취소하면 기존 기록과 원정을 유지하고 소리·화면 설정은 초기화하지 않습니다.\n\n## 공개 소스와 인수인계\n\n게시된 게임 안에 소스 보기 버튼이 있어야 합니다.\n다른 코덱스에서 즉시 이어갈 수 있는 원본 소스·전체 기획·에셋·테스트·실행 설명을 함께 제공합니다.\n소스 보기는 가짜 코드 미리보기가 아니라 배포본을 만든 실제 원본이어야 합니다.\n사용자 저장 데이터·인증 정보는 소스 묶음에 들어가지 않습니다.\n\n## 이번 구현의 잠정 선택\n\n사용자 미확정 값과 미완료 항목은 HANDOFF.md의 4~5절에 별도 기록했습니다.\n이 파일의 사용자 규칙과 HANDOFF.md의 잠정 규칙을 혼동하지 마세요.\n","docs/TEST_REPORT.md":"# 실제 점검 결과 · Piggy Quest v0.3.0\n\n## 동작·맵 개선 VM 검증 · 2026-10-04\n\n| 검사 | 결과 |\n| --- | --- |\n| Node 규칙·동작 테스트 | 29 통과 / 0 실패 |\n| 기존 Chromium 상호작용 회귀 검사 | 46 통과 / 0 실패 |\n| 이번 변경의 실제 로컬 HTTP 브라우저 검사 | 20 통과 / 0 실패 |\n| HTTP 저장·소스 ZIP·대시보드 진입 | 10 통과 / 0 실패 |\n| 브라우저 JavaScript 예외 | 0 |\n| 기존 로컬 SQLite DB | 수정 전 SHA-256 유지 |\n\n추가 검사는 발 간격·성인 비율·접지·다리와 반대 팔 흔들림, 좌우 교대 펀치,\n45ms 발차기 확장, 흙길 중앙, 배경 월드 좌표 연속성과 기존 저장의 새 맵 개방을 확인합니다.\n실제 HTTP 브라우저에서는 텍스트 선택 금지, 소스 내용 복사, 초기화 확인/취소/백업 다운로드,\n초기화 후 실제 localStorage 재로딩, 세 맵의 모든 포털·일반 적·보스 정산,\n고유 보스 이미지와 충격파 경고·일시정지·중복 피해 방지를 확인했습니다.\n포털·보스 경계 조건은 재현용 상태를 직접 설정했습니다. 사람이 세 맵을 처음부터 끝까지\n완주한 결과나 실제 iPad/Safari 검사로 해석하지 않습니다.\n\n재현: `npm test`, `python3 scripts/build.py`, `python3 tests/browser_smoke.py`.\n상위 저장소의 `tests/piggy-quest-revision-browser.py`와\n`tests/piggy-quest-browser-smoke.py`는 실제 로컬 HTTP 서버가 필요합니다.\n새 검사 결과와 기존 게임 검사 결과는 `docs/test-results.json`에 있습니다.\n이번에는 기존 서버 전체 테스트를 반복하지 않았고 HTTP 응답과 DB 보존을 확인했습니다.\n기존 전체 테스트 77 통과/6 실패 baseline은 기록만 유지했습니다.\n\n단일 HTML도 같은 산출물로 로컬 HTTP에서 검증합니다. `file://`는 VM 정책으로 차단됩니다.\n공개 HTTPS 브라우저 이동은 VM Chromium CA 신뢰 제한이 남아 있으므로 배포 후 HTTPS\n응답·파일 해시 비교와 로컬 브라우저 기능 검사를 구분합니다. 신뢰 DB나 TLS 검증을 변경하지\n않았습니다. 최종 배포 결과는 상위 `docs/piggy-quest-integration.md`에서 확인하세요.\n\n아래는 v0.2.0 통합 당시와 첨부 패키지의 기록입니다. 현재 버전의 상태와 구분합니다.\n\n## minsung VM에서 재검증 · 2026-10-04\n\n- 제공된 Node 규칙 테스트: 20개 통과, 실패 0.\n- 제공된 Chromium 상호작용 테스트: 46개 통과, 실패 0, JavaScript 예외 0.\n- 상위 저장소 `tests/piggy-quest-browser-smoke.py`: 실제 로컬 HTTP 원점에서\n  10개 검증 통과. 키보드 이동, 진짜 localStorage의 새로고침 복원, 원본 소스 일치,\n  ZIP CRC와 다운로드, 로그인 없는 대시보드 진입을 확인했습니다.\n- 기존 Node 서버 테스트 `tests/local-server.test.mjs`: 9개 통과.\n- 기존 전체 테스트의 77 통과/6 실패 baseline은 재실행하지 않았습니다.\n- `file://` 단일 파일 이동은 VM의 `ERR_BLOCKED_BY_ADMINISTRATOR` 정책 때문에\n  실행하지 못했습니다. 정책을 변경하지 않았습니다. 단일 HTML은 별도 HTTP 원점에서\n  검증하며 공개 배포 결과는 상위 `docs/piggy-quest-integration.md`에 기록합니다.\n- 원본 게임의 JS/CSS/SVG와 게임 규칙은 수정하지 않았습니다.\n\n아래는 첨부 패키지의 원래 점검 기록입니다.\n\n기준일: 2026-10-04. 이 보고서는 실행형 첫 버전의 자동 검사 결과이며\n최종 상용 품질 보증이나 실제 사이트 게시 완료를 뜻하지 않습니다.\n\n## 결과\n\n| 구분 | 결과 |\n| --- | --- |\n| Node 규칙 단위 테스트 | 20개 통과 · 실패 0 |\n| Chromium 브라우저 점검 | 46개 통과 · 실패 0 |\n| 브라우저 JavaScript 예외 | 0건 |\n| 로컬 개발 서버 HTTP 응답 | 5개 경로 정상 응답 |\n| 사이트 안의 전체 소스 ZIP | CRC 정상 · 원본 파일 바이트 일치 |\n| 사이트 안의 파일별 저장 | 원본 src/game.js와 바이트 일치 |\n| 공개 ZIP에 개인 진행 포함 여부 | 런타임 임시 식별자 미포함 확인 |\n\n세부 검사 목록과 결과는 `docs/test-results.json`에 있습니다.\n\n## 확인한 주요 흐름\n\n두 번 펀치 / 밀어내는 발차기 / 운반 중 펀치 금지·발차기 허용 /\n드롭 코인 습득 / 안전 귀환 정산 / 재정산으로 코인 중복되지 않음 /\n플레이어 사망 시 코인 보존·체력 0 유지 / 저금통 파괴 시 원정 코인만 손실 /\n치료 전 출전 차단 / 드래그 치료 / 클릭 수리 / 부활 10초·체력 50% /\n일시정지 중 부활 시간 정지 / 조수 지키기 / 상자 중복 획득 차단 /\n샛길 이동 / 발견 조수 등록 / 모든 일반 적 처치 조건 / 보스·다음 맵·재도전 /\n기술 구매 / 점프 / 특수 공격 / 저장된 진행 복원 /\n소스 보기·ZIP·개별 파일 저장 / 저장 불러오기 검증·확인·기존 기록 백업.\n\n모바일 가로 화면 920×480에서 이동·펀치·발차기 단추가 보이고\n실제 터치 입력 이벤트로 이동·손 떼기까지 동작함을 확인했습니다.\n모바일 세로 화면 390×844에서는 가로 넘침이 없으며 조수·기술 메뉴 진입을 확인했습니다.\n실행 화면, 홈 화면, 소스 화면을 캡처해 배치도 확인했습니다.\n\n## 방법과 재현\n\n- Node v22.16.0의 `node:test` 및 Python Playwright + headless Chromium.\n- 단위 테스트: `npm test`.\n- 빌드: `python scripts/build.py`.\n- 브라우저 테스트: `python tests/browser_smoke.py`.\n- 브라우저 테스트에는 별도 Playwright 설치와 Chromium이 필요합니다.\n- 기본 실행 파일 `/usr/bin/chromium`은 `CHROMIUM_PATH` 환경변수로 바꿀 수 있습니다.\n- 결과 위치는 `PIGGY_TEST_OUTPUT`으로 지정할 수 있습니다.\n\n## 검증 범위의 한계\n\n이 환경의 브라우저 정책은 URL 이동을 차단하므로 Playwright `set_content`로\n완성된 단일 HTML을 올려 실행했습니다. 정책을 해제하지 않았습니다.\n저장 복원 검사에는 테스트용 메모리 Storage 어댑터를 사용했습니다.\n실제 게임 코드의 저장 경로는 localStorage이지만 이번 결과만으로\n실제 게시 주소·파일 주소에서의 장기 저장까지 검증했다고 볼 수 없습니다.\n\n개발 서버는 루프백 HTTP로 별도 요청해 파일 응답만 확인했습니다.\n이 결과는 외부 공개 사이트 접속 확인이 아닙니다.\n\n보스·죽음·부활 등의 경계 조건은 재현 가능한 상태를 직접 설정한 검사도 포함합니다.\n모든 맵을 사람이 처음부터 끝까지 실시간으로 완주한 결과는 아닙니다.\n모바일은 Chromium 화면·터치 모의시험이며 실제 iPhone/Safari, Android 장치,\n여러 기기의 장기 세션, 다운로드 권한 정책, 실제 배포 환경은 별도 확인이 필요합니다.\n\n## 원본 v0.2.0의 미완료와 후속 검증\n\nchatgpt.site 실제 게시, 최종 몬스터 원화, 영상 수준 애니메이션,\n실제 다층 발판·위아래 갈림길, 두 번째 맵 고유 보스,\n게임 균형·완주 난이도와 실기기 성능은 후속 작업입니다.\n\n수정 시 원본 소스와 소스 보기 묶음이 어긋나지 않도록 꼭 다시 빌드하세요.\n","docs/test-results.json":"{\n  \"version\": \"0.3.0\",\n  \"date\": \"2026-10-04\",\n  \"unit_tests\": {\n    \"passed\": 29,\n    \"failed\": 0,\n    \"command\": \"npm test\"\n  },\n  \"browser\": {\n    \"version\": \"0.3.0\",\n    \"method\": \"Chromium set_content + in-memory Storage adapter; use the parent HTTP suite for actual origin persistence\",\n    \"results\": [\n      {\n        \"name\": \"Bundled HTML boots with all 12 SVG assets\",\n        \"passed\": true,\n        \"detail\": \"\"\n      },\n      {\n        \"name\": \"No horizontal overflow on desktop\",\n        \"passed\": true, width=\"1280\" height=\"720\" tabindex=\"0\" aria-label=\"A D 이동, J 펀치, K 발차기, E 상호작용, Q 조수 명령, ESC 일시정지\">\u003c/canvas>\n    \u003cdiv class=\"hero\" id=\"hero\">\n      \u003cdiv class=\"hero-copy\">\u003cp class=\"eyebrow\">\u003cspan>\u003c/span> A LITTLE PIG. A BIG ADVENTURE.\u003c/p>\u003ch1>작은 저금통과\u003cbr>\u003cem>커다란 모험.\u003c/em>\u003c/h1>\u003cp class=\"lead\">길을 찾고. 동료를 만나고. 저금통을 지켜주세요.\u003cbr>당신의 첫 번째 원정이 시작됩니다.\u003c/p>\u003cp class=\"home-vitals\" id=\"home-vitals\">\u003c/p>\u003cbutton id=\"depart\" class=\"primary hero-action\">탐험 떠나기 \u003cspan>↗\u003c/span>\u003c/button>\u003cbutton class=\"text-link\" data-view=\"bag\">출발 전, 체력을 확인하세요 \u003cspan>→\u003c/span>\u003c/button>\u003c/div>\n      \u003cbutton id=\"map-select\" class=\"next-map\">\u003cb id=\"map-number\">01\u003c/b>\u003cspan>\u003csmall>NEXT ADVENTURE\u003c/small>\u003cstrong id=\"map-label\">바람숲\u003c/strong>\u003c/span>\u003ci>→\u003c/i>\u003c/button>\n      \u003cp class=\"camp-caption\">◦ &nbsp; 바람이 머무는 캠프\u003csmall>우리의 모험은 여기서부터.\u003c/small>\u003c/p>\n      \u003cdiv class=\"hero-foot\">● 브라우저에 자동 저장 \u003cspan>/\u003c/span> 로그인 없는 오프라인 모험\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"game-ui\" id=\"game-ui\" hidden>\n      \u003cdiv class=\"health-box\">\u003cdiv>\u003cspan class=\"health-symbol\">◯\u003c/span>\u003clabel>나의 체력 \u003csmall id=\"player-health-text\">\u003c/small>\u003cprogress id=\"player-health\" max=\"100\" value=\"100\">\u003c/progress>\u003c/label>\u003c/div>\u003cdiv>\u003cspan class=\"health-symbol\">🐷\u003c/span>\u003clabel>저금통 \u003csmall id=\"pig-health-text\">\u003c/small>\u003cprogress id=\"pig-health\" class=\"pink\" max=\"180\" value=\"180\">\u003c/progress>\u003c/label>\u003c/div>\u003c/div>\n      \u003cbutton class=\"quest-pill\" id=\"world-map\">\u003cstrong id=\"room-label\">바람숲 · 큰길\u003c/strong>\u003cspan id=\"kill-count\">0 / 24 처치　⌘\u003c/span>\u003c/button>\n      \u003cdiv class=\"game-top-right\">\u003cdiv class=\"run-money\">\u003cspan>◉\u003c/span>\u003clabel>이번 원정\u003cb id=\"run-coins\">0\u003c/b>\u003c/label>\u003c/div>\u003cbutton id=\"pause\" class=\"pause-btn\" aria-label=\"일시정지\">☰\u003c/button>\u003c/div>\n      \u003cbutton id=\"command\" class=\"command-pill\">● 조수 · 따라오기 \u003ckbd>Q\u003c/kbd>\u003c/button>\n      \u003cdiv class=\"movement\">\u003cbutton data-hold=\"a\" aria-label=\"왼쪽 이동\">‹\u003c/button>\u003cbutton data-hold=\"d\" aria-label=\"오른쪽 이동\">›\u003c/button>\u003cbutton id=\"jump-btn\" data-action=\"jump\" aria-label=\"뛰기\">↟\u003csmall>뛰기\u003c/small>\u003c/button>\u003c/div>\n      \u003cdiv class=\"skills-pad\" id=\"skills-pad\">\u003c/div>\n      \u003cdiv class=\"combat\">\u003cbutton data-action=\"interact\">\u003ckbd>E\u003c/kbd>\u003cspan id=\"carry-icon\">↥\u003c/span>\u003csmall id=\"carry-label\">들기 · 사용\u003c/small>\u003c/button>\u003cbutton data-hold=\"j\" id=\"punch-btn\">\u003ckbd>J\u003c/kbd>\u003cspan>✧\u003c/span>\u003csmall>펀치\u003c/small>\u003c/button>\u003cbutton data-hold=\"k\" id=\"kick-btn\" class=\"kick\">\u003ckbd>K\u003c/kbd>\u003cspan>↗\u003c/span>\u003csmall>발차기\u003c/small>\u003c/button>\u003c/div>\n      \u003cdiv class=\"progress-track\">\u003ci id=\"distance-progress\">\u003c/i>\u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"loading\" class=\"loading\">\u003cspan class=\"brand-mark\">🐷\u003c/span>\u003cp>원정 가방을 챙기는 중…\u003c/p>\u003c/div>\n  \u003c/section>\n  \u003cnav class=\"mobile-nav\" aria-label=\"모바일 홈 메뉴\">\n    \u003cbutton data-view=\"camp\" class=\"active\">캠프\u003c/button>\n    \u003cbutton data-view=\"helpers\">조수 모음집\u003c/button>\n    \u003cbutton data-view=\"skills\">기술 배우기\u003c/button>\n    \u003cbutton data-view=\"bag\">가방 · 치료\u003c/button>\n  \u003c/nav>\n\u003c/main>\n\u003cfooter>\u003cdiv>\u003cspan class=\"live-dot\">\u003c/span> 원정대 기록 \u003cspan class=\"muted\">v0.3.0\u003c/span>\u003cspan class=\"separator\">·\u003c/span>\u003cbutton id=\"help\">조작법 · 게임 규칙\u003c/button>\u003cbutton id=\"save-tools\">저장 관리\u003c/button>\u003cbutton id=\"new-game\">처음부터 시작\u003c/button>\u003c/div>\u003cdiv class=\"footer-controls\">\u003cspan>이동 A D · 펀치 J · 발차기 K · 상호작용 E\u003c/span>\u003cbutton id=\"sound\" aria-label=\"효과음 켜기\">♪\u003c/button>\u003cbutton id=\"fullscreen\" aria-label=\"전체 화면\">⛶\u003c/button>\u003c/div>\u003c/footer>\n\u003cp class=\"rotate-hint\">휴대전화는 가로로 돌리면 더 넓게 탐험할 수 있어요.\u003c/p>\n\u003c/div>\n\u003cdialog id=\"modal\" aria-labelledby=\"modal-title\">\u003cdiv id=\"modal-body\">\u003c/div>\u003c/dialog>\n\u003cdiv id=\"toast\" class=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\u003cinput id=\"import-save\" type=\"file\" accept=\".json,application/json\" hidden>\n\u003cscript src=\"source-bundle.js\">\u003c/script>\n\u003cscript src=\"src/config.js\">\u003c/script>\n\u003cscript src=\"src/motion.js\">\u003c/script>\n\u003cscript src=\"src/state.js\">\u003c/script>\n\u003cscript src=\"src/art.js\">\u003c/script>\n\u003cscript src=\"src/audio.js\">\u003c/script>\n\u003cscript src=\"src/game.js\">\u003c/script>\n\u003cscript src=\"src/export.js\">\u003c/script>\n\u003cscript src=\"src/ui.js\">\u003c/script>\n\u003cscript src=\"src/main.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n","package.json":"{\n  \"name\": \"piggy-quest\",\n  \"version\": \"0.3.0\",\n  \"private\": true,\n  \"description\": \"Offline-first side-scrolling piggy-bank escort game with its own source viewer\",\n  \"scripts\": {\n    \"start\": \"node scripts/serve.mjs\",\n    \"test\": \"node --test tests/*.test.cjs\",\n    \"build\": \"python scripts/build.py\"\n  },\n  \"engines\": {\n    \"node\": \">=20\"\n  }\n}\n","scripts/build.py":"\"\"\"Bundle the exact source into a self-contained HTML and a directory source manifest.\nOnly public project files are allowlisted. Browser saves, keys, environment files,\nnode_modules, user uploads, screenshots and generated archives are never bundled.\n\"\"\"\nfrom pathlib import Path\nimport json, re, hashlib\nROOT=Path(__file__).resolve().parents[1]\nROOT_FILES=['index.html','source.html','styles.css','package.json','README.md','HANDOFF.md','AGENTS.md','CODEX_PROMPT.md']\nDIRS=['src','assets','scripts','tests','docs']\nEXTS={'.js','.cjs','.mjs','.json','.html','.css','.md','.svg','.py'}\n\ndef source_files():\n    paths=[ROOT/n for n in ROOT_FILES if (ROOT/n).is_file()]\n    for folder in DIRS:\n        paths += [p for p in (ROOT/folder).rglob('*') if p.is_file() and p.suffix in EXTS and '__pycache__' not in str(p)]\n    return {str(p.relative_to(ROOT)).replace('\\\\','/'):p.read_text(encoding='utf-8') for p in sorted(set(paths))}\n\ndef build():\n    files=source_files()\n    payload=json.dumps(files,ensure_ascii=False,separators=(',',':')).replace('\u003c','\\\\u003c')\n    bundle='globalThis.PIGGY=globalThis.PIGGY||{};globalThis.PIGGY.SOURCE_FILES='+payload+';\\n'\n    (ROOT/'source-bundle.js').write_text(bundle,encoding='utf-8')\n    html=files['index.html']\n    html=html.replace('\u003clink rel=\"stylesheet\" href=\"styles.css\">','\u003cstyle>\\n'+files['styles.css']+'\\n\u003c/style>')\n    def inline(match):\n        name=match.group(1)\n        text=bundle if name=='source-bundle.js' else files[name]\n        text=re.sub(r'\u003c/script',r'\u003c\\\\/script',text,flags=re.I)\n        return '\u003cscript>\\n'+text+'\\n\u003c/script>'\n    html=re.sub(r'\u003cscript src=\"([^\"]+)\">\u003c/script>',inline,html)\n    dist=ROOT/'dist';dist.mkdir(exist_ok=True)\n    (dist/'index.html').write_text(html,encoding='utf-8')\n    info={'version':json.loads(files['package.json'])['version'],'source_file_count':len(files),'html_bytes':len(html.encode()),'sha256':hashlib.sha256(html.encode()).hexdigest(),'network_required':False,'published':False}\n    (dist/'build-info.json').write_text(json.dumps(info,indent=2)+'\\n')\n    print(json.dumps(info,indent=2))\n\nif __name__=='__main__':build()\n","scripts/make_assets.py":"\"\"\"Reproducible original vector placeholders; replace paths without cha path d=\"M13 29L5 60L21 68L30 43M84 29L96 58L82 68L70 42\" fill=\"#6f8971\" stroke=\"#4f695b\" stroke-width=\"3\"/>\u003cpath d=\"M26 55L20 77L42 77L47 58M56 57L62 77L83 77L73 52\" fill=\"#627c64\" stroke=\"#4f695b\" stroke-width=\"3\"/>\u003cpath d=\"M24 20L38 8L70 11L82 35L75 59L51 68L26 55L17 34Z\" fill=\"#8d9b73\" stroke=\"#4f695b\" stroke-width=\"3\"/>\u003cpath d=\"M27 16L19 0L40 10M65 12L82 0L76 23\" fill=\"#c9c7a3\" stroke=\"#697954\" stroke-width=\"2\"/>\u003cpath d=\"M29 12q3-17 18-9q11-8 19 3l5 16l-22-5l-11 8Z\" fill=\"#5d7e51\"/>\u003cpath d=\"M31 30l10 3M58 32l11-3\" stroke=\"#354d43\" stroke-width=\"5\" stroke-linecap=\"round\"/>\u003cpath d=\"M43 45l6 5l9-6\" fill=\"none\" stroke=\"#354d43\" stroke-width=\"3\"/>\u003cpath d=\"M29 48l12 8M62 51l8-7\" stroke=\"#b5be96\" stroke-width=\"4\"/>''',\n'chest':'''\u003crect x=\"13\" y=\"34\" width=\"76\" height=\"41\" rx=\"6\" fill=\"#98764a\" stroke=\"#6b5b3b\" stroke-width=\"3\"/>\u003cpath d=\"M13 36Q13 8 40 8H64Q89 8 89 36Z\" fill=\"#b89158\" stroke=\"#6b5b3b\" stroke-width=\"3\"/>\u003cpath d=\"M14 38h75M31 12v60M73 12v60\" stroke=\"#d2b777\" stroke-width=\"7\"/>\u003crect x=\"43\" y=\"31\" width=\"17\" height=\"21\" rx=\"4\" fill=\"#e5c782\" stroke=\"#7e7147\" stroke-width=\"2\"/>\u003ccircle cx=\"51.5\" cy=\"40\" r=\"3\" fill=\"#756441\"/>''',\n'coin':'''\u003cellipse cx=\"50\" cy=\"40\" rx=\"29\" ry=\"34\" fill=\"#b88b42\"/>\u003cellipse cx=\"47\" cy=\"38\" rx=\"28\" ry=\"33\" fill=\"#e7bd6a\" stroke=\"#c69542\" stroke-width=\"2\"/>\u003cellipse cx=\"47\" cy=\"38\" rx=\"21\" ry=\"25\" fill=\"none\" stroke=\"#f7d898\" stroke-width=\"2\"/>\u003cpath d=\"M55 25q-17-5-18 5q0 6 12 8q12 3 6 10q-7 7-21 0M47 18v41\" stroke=\"#b7883e\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/>''',\n'potion':'''\u003cpath d=\"M35 17v17Q16 46 25 68Q47 80 71 68Q81 46 64 34V17\" fill=\"#d4e4d2\" stroke=\"#719284\" stroke-width=\"3\"/>\u003cpath d=\"M25 52q22-9 46 0l-2 16q-21 11-43 0Z\" fill=\"#e39fa9\"/>\u003crect x=\"32\" y=\"8\" width=\"35\" height=\"15\" rx=\"4\" fill=\"#b69169\" stroke=\"#887052\" stroke-width=\"3\"/>\u003cpath d=\"M48 46v17M40 54h17\" stroke=\"#fff2dd\" stroke-width=\"5\" stroke-linecap=\"round\"/>''',\n'repair':'''\u003cpath d=\"M60 7q-24 0-23 25L14 57q-11 14 5 19q5 1 10-6l26-29q24-1 25-24L63 27L50 20Z\" fill=\"#9aafa5\" stroke=\"#577b6f\" stroke-width=\"3\"/>\u003ccircle cx=\"22\" cy=\"64\" r=\"4\" fill=\"#e5ead6\"/>'''\n}\nfor name,body in shapes.items():\n view='0 0 120 80' if name=='pig' else '0 0 100 80'\n svg=f'\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"{view}\">\u003cdefs>\u003clinearGradient id=\"p\" x2=\"0\" y2=\"1\">\u003cstop stop-color=\"#f4c3c0\"/>\u003cstop offset=\"1\" stop-color=\"#df95a7\"/>\u003c/linearGradient>\u003clinearGradient id=\"s\" x2=\"0\" y2=\"1\">\u003cstop stop-color=\"#c8d993\"/>\u003cstop offset=\"1\" stop-color=\"#91b26d\"/>\u003c/linearGradient>\u003c/defs>{body}\u003c/svg>'\n (root/f'{name}.svg').write_text(svg)\nmanifest={'version':1,'provenance':'Original code-authored SVG prototype art; not final painted or generated animation assets.', 'assets':{k:{'file':f'assets/{k}.svg','type':'svg','anchor':'bottom-center'} for k in sorted(p.stem for p in root.glob('*.svg'))}}\n(root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))\n","scripts/serve.mjs":"/** Dependency-free development server, loopback only. Not a production backend. */\nimport http from 'node:http';\nimport fs from 'node:fs/promises';\nimport path from 'node:path';\nimport {fileURLToPath} from 'node:url';\nconst root=path.resolve(path.dirname(fileURLToPath(import.meta.url)),'..');\nconst port=Number(process.env.PORT||4173);\nconst mime={'.html':'text/html; charset=utf-8','.css':'text/css; charset=utf-8','.js':'application/javascript; charset=utf-8','.json':'application/json; charset=utf-8','.svg':'image/svg+xml','.md':'text/plain; charset=utf-8','.png':'image/png'};\nhttp.createServer(async(req,res)=>{\n  try {\n    const url=new URL(req.url,'http://127.0.0.1');\n    const relative=decodeURIComponent(url.pathname).replace(/^\\/+/, '')||'index.html';\n    let target=path.resolve(root,relative);\n    if(target!==root&&!target.startsWith(root+path.sep)){res.writeHead(403);res.end('Forbidden');return;}\n    const stat=await fs.stat(target);if(stat.isDirectory())target=path.join(target,'index.html');\n    const data=await fs.readFile(target);res.writeHead(200,{'Content-Type':mime[path.extname(target)]||'application/octet-stream','Cache-Control':'no-store','X-Content-Type-Options':'nosniff'});res.end(data);\n  }catch{res.writeHead(404,{'Content-Type':'text/plain'});res.end('Not found');}\n}).listen(port,'127.0.0.1',()=>console.log(`Piggy Quest: http://127.0.0.1:${port}`));\n","source.html":"\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>저금통 원정대 · 소스코드\u003c/title>\u003cmeta http-equiv=\"refresh\" content=\"0;url=index.html#source\">\u003c/head>\u003cbody>\u003ca href=\"index.html#source\">소스코드 작업실 열기\u003c/a>\u003c/body>\u003c/html>\n","src/art.js":"/** Layered Canvas scenery and procedural joint animation. Assets remain replaceable. */\n(function(P){\n  'use strict';\n  const images={}, C=P.CONFIG;\n  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));\n  const ellipse=(c,x,y,rx,ry,color)=>{c.fillStyle=color;c.beginPath();c.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),0,0,Math.PI*2);c.fill();};\n  const line=(c,points,color,width)=>{c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.lineJoin='round';c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.stroke();};\n  function image(c,name,x,y,w,h,alpha=1){const img=images[name];if(!img?.complete||!img.naturalWidth)return;c.save();c.globalAlpha*=alpha;c.drawImage(img,x-w/2,y-h,w,h);c.restore();}\n  async function init(){await Promise.all(['pig','slime','boar','rock','bat','boss','boss-amber','boss-brook','chest','coin','potion','repair'].map(name=>new Promise(resolve=>{const img=new Image();images[name]=img;img.onload=resolve;img.onerror=resolve;const text=P.SOURCE_FILES?.['assets/'+name+'.svg'];img.src=text?'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(text):'assets/'+name+'.svg';})));}\n  function tree(c,x,y,s,variant,alpha=1){\n    c.save();c.translate(x,y);c.scale(s,s);c.globalAlpha*=alpha;\n    c.fillStyle=variant?'#718769':'#5f7d67';c.beginPath();c.moveTo(-13,0);c.lineTo(-8,-165);c.lineTo(-30,-222);c.lineTo(0,-195);c.lineTo(21,-252);c.lineTo(12,-163);c.lineTo(24,0);c.fill();\n    const colors=variant?['#a5b68a','#91a878','#bdc799','#92a775']:['#8ca477','#6f8d68','#a2b482','#819d6e'];\n    for(let i=0;i\u003c6;i++){const a=i*2.3+variant;ellipse(c,Math.sin(a)*61,-209+Math.cos(a*1.2)*38,63+(i%3)*9,64+(i%2)*12,colors[i%4]);}\n    c.globalAlpha*=.3;ellipse(c,0,-260,55,17,'#e5e5ba');c.restore();\n  }\n  function rock(c,x,y,s){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle='#91a187';c.beginPath();c.moveTo(-27,0);c.lineTo(-18,-19);c.lineTo(5,-29);c.lineTo(26,-11);c.lineTo(32,0);c.fill();c.fillStyle='#bfccb0';c.beginPath();c.moveTo(-18,-19);c.lineTo(5,-29);c.lineTo(26,-11);c.lineTo(-2,-8);c.fill();c.restore();}\n  function anchors(camera,speed,spacing,margin=340){\n    const offset=camera*speed,first=Math.floor((offset-margin)/spacing),last=Math.ceil((offset+1280+margin)/spacing);\n    return Array.from({length:last-first+1},(_,n)=>{const id=first+n;return {id,worldX:id*spacing,x:id*spacing-offset};});\n  }\n  const seed=id=>{const n=Math.sin(id*127.1+3.1)*43758.5453;return n-Math.floor(n);};\n  function scenery(c,camera,time,theme='forest',cave=false){\n    const amber=theme==='amber',brook=theme==='brook';\n    const g=c.createLinearGradient(0,0,0,720);\n    g.addColorStop(0,cave?'#a4b5a2':amber?'#eedbbd':brook?'#d6e7df':'#dfe7ce');\n    g.addColorStop(1,cave?'#718e7a':amber?'#c8b591':brook?'#e5ebd5':'#ecedd2');c.fillStyle=g;c.fillRect(0,0,1280,720);\n    if(!cave){ellipse(c,930,126,36,36,amber?'#ffe0a9':'#fff7d3');c.globalAlpha=.5;\n      for(const a of anchors(camera,.07,389)){const y=80+(Math.abs(a.id)%3)*44;ellipse(c,a.x,y+8,98,12,'#ffffea');ellipse(c,a.x+20,y,58,17,'#ffffea');}c.globalAlpha=1;}\n    for(let layer=0;layer\u003c3;layer++){\n      const speed=[.12,.32,.62][layer],yy=[490,530,550][layer];\n      c.globalAlpha=[.26,.31,.18][layer];c.fillStyle=amber?'#a88f73':brook?'#779a8a':'#829e81';\n      c.beginPath();c.moveTo(0,720);for(let x=-80;x\u003c=1380;x+=40)c.lineTo(x,yy-35+Math.sin((x+camera*speed)/410)*44);c.lineTo(1280,720);c.fill();c.globalAlpha=1;\n      for(const a of anchors(camera,speed,340))tree(c,a.x+seed(a.id)*58,yy,[.64,.88,1.16][layer],Math.abs(a.id+layer)%2,[.27,.43,.68][layer]);\n    }\n    if(cave){c.globalAlpha=.42;c.fillStyle='#577063';for(const a of anchors(camera,.28,230)){c.beginPath();c.moveTo(a.x,0);c.lineTo(a.x+140,0);c.lineTo(a.x+85,90+seed(a.id)*90);c.closePath();c.fill();}c.globalAlpha=1;}\n    const floor=c.createLinearGradient(0,C.roadTop,0,C.roadBottom);floor.addColorStop(0,amber?'#d4bf8f':'#d7cea0');floor.addColorStop(1,amber?'#b39a6a':'#c7bb87');c.fillStyle=floor;c.fillRect(0,C.roadTop,1280,C.roadBottom-C.roadTop);\n    c.fillStyle='#acb481';c.fillRect(0,C.roadTop-6,1280,8);\n    for(const a of anchors(camera,1,23,25))line(c,[[a.x,C.roadTop-2],[a.x-3,C.roadTop-12+(Math.abs(a.id)%3)*2]],'#95a06c',2);\n    for(const a of anchors(camera,1,179,30)){const y=C.roadTop+24+(Math.abs(a.id)%5)*13;line(c,[[a.x,y],[a.x+13+(Math.abs(a.id)%4)*6,y]],'rgba(132,124,76,.13)',2);}\n    c.fillStyle=brook?'#81a18c':'#8e9e70';c.fillRect(0,C.roadBottom,1280,720-C.roadBottom);\n    for(const a of anchors(camera,1.12,270)){rock(c,a.x+86,720,.85);c.save();c.translate(a.x+35,716);c.rotate(-.3);for(let n=0;n\u003c4;n++)ellipse(c,n*8,-10-n*7,9,25,brook?'#779c91':'#789b80');c.restore();}\n    for(const a of anchors(camera,.14,111,30))ellipse(c,a.x,220+seed(a.id)*290+Math.sin(time+a.id)*4,1.6,1.6,'rgba(255,247,183,.5)');\n  }\n  function landmarks(c,room,camera,theme){\n    for(const mark of room.landmarks||[]){\n      if(mark.x\u003ccamera-350||mark.x>camera+1630)continue;\n      c.save();c.translate(mark.x,0);\n      const y=C.roadTop;\n      if(mark.kind==='bridge'){\n        c.fillStyle='#80a9a0';c.fillRect(-190,y-36,380,38);\n        c.fillStyle='#ba9f71';c.fillRect(-180,y+8,360,88);\n        for(let i=-180;i\u003c180;i+=24)line(c,[[i,y+8],[i,y+94]],'#977e56',2);\n        for(const side of [-1,1]){line(c,[[side*170,y-42],[side*170,y+8]],'#7e7955',7);}\n        line(c,[[-176,y-29],[0,y-16],[176,y-29]],'#999169',5);\n      }else if(mark.kind==='mill'){\n        c.fillStyle='#a79a72';c.fillRect(-125,y-142,145,142);c.fillStyle='#7f8a64';c.beginPath();c.moveTo(-148,y-140);c.lineTo(-56,y-211);c.lineTo(41,y-140);c.fill();\n        c.fillStyle='#536d61';c.fillRect(-80,y-68,41,68);ellipse(c,48,y-69,72,72,'#a79262');ellipse(c,48,y-69,54,54,'#c5b18a');\n        for(let i=0;i\u003c8;i++){const a=i*Math.PI/4;line(c,[[48,y-69],[48+Math.cos(a)*66,y-69+Math.sin(a)*66]],'#857953',7);}ellipse(c,48,y-69,12,12,'#80744f');\n      }else if(mark.kind==='pond'){\n        ellipse(c,0,y-28,172,31,'#86b4a4');ellipse(c,12,y-35,123,12,'#b9d8c4');\n        for(let i=0;i\u003c7;i++){const x=-155+i*49;line(c,[[x,y-4],[x+8,y-65]],'#79966c',3);ellipse(c,x+8,y-68,3,10,'#9b895c');}\n      }else if(mark.kind==='arch'||mark.kind==='tower'){\n        const h=mark.kind==='tower'?255:176;c.fillStyle=theme==='amber'?'#b29d78':'#9bab91';\n        c.fillRect(-84,y-h,40,h);c.fillRect(44,y-h,40,h);c.fillRect(-84,y-h,168,35);\n        for(let n=0;n\u003c5;n++)line(c,[[-84,y-h+n*37],[-44,y-h+n*37]],'#849279',2);\n        ellipse(c,-62,y-h-5,31,10,'#86a372');ellipse(c,58,y-h-7,36,12,'#8ba879');\n      }else if(mark.kind==='hollow'){\n        c.fillStyle='#8b8d61';c.beginPath();c.roundRect(-80,y-240,160,242,[66,66,12,12]);c.fill();\n        ellipse(c,0,y-57,39,53,'#465d46');line(c,[[-64,y-90],[-97,y-14],[-135,y]],'#8b8d61',14);\n        tree(c,0,y-210,.55,1,.75);\n      }else if(mark.kind==='crystal'){\n        for(let n=0;n\u003c4;n++){const x=-65+n*33,h=43+(n%3)*22;c.fillStyle=['#a5c9b5','#c7dfc9','#84b3a7'][n%3];c.beginPath();c.moveTo(x,y);c.lineTo(x-12,y-h*.6);c.lineTo(x+3,y-h);c.lineTo(x+18,y-h*.6);c.lineTo(x+12,y);c.fill();}\n      }else{\n        line(c,[[0,y-75],[0,y]],'#8a8261',8);c.fillStyle='#b7b691';c.beginPath();c.roundRect(-60,y-84,120,40,7);c.fill();label(c,mark.label||'모험의 길',0,y-59,12,'#506c50');\n      }\n      c.restore();\n    }\n  }\n  function stick(c,x,y,o={}){\n    const rig=P.Motion.pose(o),body=o.color||'#294a40';\n    const {hip,shoulder,head,rearFoot,frontFoot,rearHand,frontHand,rearElbow,frontElbow,rearKnee,frontKnee}=rig;\n    c.save();c.translate(x,y);c.scale((o.scale||1)*(o.dir||1),o.scale||1);\n    const limb=(a,mid,b,width=6.5)=>line(c,[a,mid,b],body,width);\n    c.globalAlpha=.7;limb(shoulder,rearElbow,rearHand);limb(hip,rearKnee,rearFoot);c.globalAlpha=1;\n    line(c,[hip,[(hip[0]+shoulder[0])*.5,(hip[1]+shoulder[1])*.5],shoulder],body,7);\n    line(c,[shoulder,[head[0],head[1]+13]],body,5.5);\n    limb(hip,frontKnee,frontFoot);limb(shoulder,frontElbow,frontHand);\n    for(const foot of [rearFoot,frontFoot])line(c,[[foot[0]-3,foot[1]],[foot[0]+7,foot[1]]],body,6);\n    ellipse(c,head[0],head[1],13,13,'#f6f2d9');c.strokeStyle=body;c.lineWidth=4.5;c.beginPath();c.arc(head[0],head[1],13,0,Math.PI*2);c.stroke();\n    line(c,[[head[0]-13,head[1]-2],[head[0]+13,head[1]-2]],o.band||'#dbbc70',3);\n    line(c,[[head[0]-12,head[1]-2],[head[0]-24,head[1]+1],[head[0]-28,head[1]-2]],o.band||'#dbbc70',2.5);\n    if(o.shield){c.fillStyle='#c8d1be';c.strokeStyle=body;c.lineWidth=3;c.beginPath();c.ellipse(frontHand[0],frontHand[1]-7,16,24,-.15,0,Math.PI*2);c.fill();c.stroke();}\n    c.restore();\n  }\n  function bar(c,x,y,value,max,w=70,color='#789f7e'){\n    c.fillStyle='rgba(254,250,230,.8)';c.beginPath();c.roundRect(x-w/2,y,w,6,3);c.fill();c.fillStyle=color;c.beginPath();c.roundRect(x-w/2,y,w*clamp(value/max,0,1),6,3);c.fill();\n  }\n  function label(c,text,x,y,size=14,color='#426457'){c.font=`500 ${size}px system-ui, sans-serif`;c.textAlign='center';c.fillStyle=color;c.fillText(text,x,y);}\n  P.Art={init,image,images,ellipse,line,scenery,landmarks,anchors,stick,bar,label,rock};\n})(globalThis.PIGGY = globalThis.PIGGY || {});\n","src/audio.js":"/** Tiny synthesized sound palette. Nothing is downloaded; silent until an input gesture. */\n(function(P){let context=null;P.Audio={\n unlock(){try{context ||= new (window.AudioContext||window.webkitAudioContext)();context.resume().catch(()=>{});}catch{}},\n play(name){if(!P.state?.settings.sound||!context)return;try{const t=context.currentTime,o=context.createOscillator(),g=context.createGain();o.connect(g);g.connect(context.destination);o.type=name==='hit'?'triangle':'sine';const f={coin:840,hit:160,heal:520,chest:680,warning:240,skill:340}[name]||440;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(name==='coin'?f*1.5:f*.5,t+.12);g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.17);o.start(t);o.stop(t+.18);}catch{}}\n};})(globalThis.PIGGY = globalThis.PIGGY || {});\n","src/config.js":"/** Gameplay data. Keep balance values and permanent IDs here, not in rendering. */\n(function (P) {\n  'use strict';\n  P.VERSION = '0.3.0';\n  P.CONFIG = { width:1280, height:720, ground:600, roadTop:550, roadBottom:650, carryHeight:196, fixedStep:1/60,\n    walkSpeed:230, gravity:1600, jumpSpeed:590, guardRadius:240,\n    punchCooldown:.5, kickCooldown:1, reviveSeconds:10, reviveFraction:.5,\n    saveKey:'piggy-quest-save-v2', sourceDate:'2026-10-04' };\n  P.HELPERS = [\n    {id:'sprout',name:'새싹',role:'가벼운 두 주먹',description:'빠른 두 주먹으로 곁을 지키는 첫 동료.',color:'#498c83',hp:80,attack:9,range:88,cooldown:.85,price:0},\n    {id:'shield',name:'둥근 방패',role:'가까이서 든든하게',description:'받는 피해를 절반으로 줄이는 방패 조수.',color:'#6a789c',hp:15 ||e.key===' '){e.preventDefault();UI.doHeal(c.dataset.healTarget,selectedItem);}};});\n      if(rescue)$('rescue').onclick=()=>{if(s.player.hp\u003c1&&!s.inventory.potion&&s.coins\u003c30)s.inventory.potion=1;if(s.pig.hp\u003c1&&!s.inventory.repair&&s.coins\u003c45)s.inventory.repair=1;P.State.save(s);UI.bag();UI.toast('긴급 보급을 가방에 넣었어요. 끌어서 치료하세요.');};\n      UI.bindPurchases(()=>UI.bag());\n    },\n    doHeal(target,item){const error=P.State.heal(P.state,target,item);if(error){UI.toast(error);return;}P.State.save(P.state);P.Audio.play('heal');UI.bag();UI.refreshHome();UI.toast(target==='pig'?'저금통을 수리했어요.':'체력을 회복했어요.');},\n    maps(){\n      if(!UI.campOnly())return;const s=P.state;\n      UI.open('다음 원정은 어디로?','맵마다 진행을 따로 기억해요. 클리어한 맵은 처음부터 다시 도전할 수 있어요.',`\u003cdiv class=\"dialog-content\">\u003cdiv class=\"cards two\">${P.MAPS.map(m=>{const p=s.progress[m.id],unlocked=s.unlocked.includes(m.id);return `\u003carticle class=\"card\">\u003cspan class=\"skill-icon\">${m.tag}\u003c/span>\u003ch3>${m.name}\u003c/h3>\u003cspan class=\"badge\">${!unlocked?'잠김':p.cleared?'클리어':'진행 중'}\u003c/span>\u003cp>${m.subtitle}\u003c/p>\u003cdiv class=\"statline\">일반 몬스터 ${p.dead.length} / ${P.allEnemies(m).length} · 보스 1마리\u003c/div>\u003cbutton class=\"primary\" data-map=\"${m.id}\" ${unlocked?'':'disabled'}>${!unlocked?'앞선 맵을 클리어하세요':p.cleared?'처음부터 다시 플레이':'이 맵 탐험하기'}\u003c/button>\u003c/article>`;}).join('')}\u003c/div>\u003c/div>`,{eyebrow:'CHOOSE YOUR NEXT CHAPTER'});\n      document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>{P.state.selectedMap=b.dataset.map;P.State.save(P.state);UI.refreshHome();UI.depart(b.dataset.map,s.progress[b.dataset.map].cleared);});\n    },\n    worldMap(){\n      if(!P.state.active){UI.maps();return;}const g=P.game,p=g.progress;\n      UI.open(g.map.name+' · 탐험 기록','모든 일반 몬스터를 처치하면 가장 깊은 곳의 보스가 나타납니다.',`\u003cdiv class=\"dialog-content\">${Object.entries(g.map.rooms).map(([id,room])=>{const dead=room.enemies.filter(e=>p.dead.includes(e.id)).length,missing=room.enemies.filter(e=>!p.dead.includes(e.id));return `\u003csection class=\"world-room\">\u003ch3>${p.visited.includes(id)?room.name:'아직 가보지 않은 샛길'} ${id===g.roomId?'· 현재 위치':''}\u003c/h3>\u003cspan class=\"badge\">${dead} / ${room.enemies.length} 처치\u003c/span>\u003cprogress value=\"${dead}\" max=\"${room.enemies.length}\">\u003c/progress>\u003cp>${missing.length?'남은 적: '+missing.map(e=>Math.round(e.x/room.width*100)+'% 지점').join(' · '):'이 구역을 모두 탐험했어요.'}\u003c/p>${id==='main'?'\u003cdiv class=\"mini-route\">\u003cspan>캠프\u003c/span>\u003cb>\u003c/b>\u003cspan>샛길\u003c/span>\u003cb>\u003c/b>\u003cspan>숨겨진 길\u003c/span>\u003cb>\u003c/b>\u003cspan>보스\u003c/span>\u003c/div>':''}\u003c/section>`;}).join('')}\u003cp class=\"smallnote\">저금통이 멀어져 이동이 멈추면 돌아가서 E로 들어주세요. 샛길 입구 앞에서 E를 누르면 이동합니다.\u003c/p>\u003c/div>`,{eyebrow:'A MAP OF LITTLE DISCOVERIES'});\n    },\n    help(){UI.open('작은 원정 안내서','저금통을 데리고 넓은 길을 탐험하는 횡스크롤 모험입니다.',`\u003cdiv class=\"dialog-content rules\">\u003csection>\u003ch3>함께 익힐 조작\u003c/h3>\u003ctable>\u003ctr>\u003ctd>A D / ← →\u003c/td>\u003ctd>좌우 이동 · 휴대전화는 화면 버튼\u003c/td>\u003c/tr>\u003ctr>\u003ctd>J / K\u003c/td>\u003ctd>두 번 펀치 / 밀어내는 발차기\u003cbr>재사용 0.5초 / 1초 · 길게 누르면 반복\u003c/td>\u003c/tr>\u003ctr>\u003ctd>E\u003c/td>\u003ctd>저금통 들기·내려놓기 / 상자·샛길·조수와 상호작용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Q\u003c/td>\u003ctd>조수 따라오기 ↔ 저금통 지키기\u003cbr>저금통을 직접 눌러도 전환\u003c/td>\u003c/tr>\u003ctr>\u003ctd>스페이스\u003c/td>\u003ctd>뛰기 · 홈에서 먼저 구매\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1 2 3\u003c/td>\u003ctd>장착한 특수 기술 사용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ESC / M\u003c/td>\u003ctd>일시정지 / 탐험 기록 보기\u003c/td>\u003c/tr>\u003c/table>\u003c/section>\u003csection>\u003ch3>저금통이 가장 중요해요\u003c/h3>\u003cp>몬스터가 화면 안에 보이면 다가옵니다. 저금통을 들고 있을 때는 펀치·불 펀치·총을 사용할 수 없어요. 발차기로 길을 열어보세요.\u003c/p>\u003cp>몬스터가 떨어뜨린 코인 위를 걸으면 코인이 저금통에 들어가고 통통 뛰어요. 홈으로 돌아가거나 플레이어만 쓰러지면 코인을 가져가요. 저금통이 깨지면 이번 원정 코인만 잃어요.\u003c/p>\u003cp>귀환해도 처치한 몬스터는 다시 나오지 않아요. 샛길까지 모두 정리한 뒤 보스를 잡으면 다음 맵이 열립니다.\u003c/p>\u003cp>홈에서는 체력이 회복되지 않아요. 치료제와 수리도구를 구입해 끌어다 놓으세요. 조수는 전투 중 10초 뒤 체력 50%로 부활해요.\u003c/p>\u003cp class=\"smallnote\">현재 그림과 움직임은 원본 벡터·관절 애니메이션을 사용한 시험판입니다. 고급 완성형 애니메이션과 최종 일러스트로 교체할 수 있게 파일을 나눠두었습니다.\u003c/p>\u003c/section>\u003c/div>`,{eyebrow:'HOW TO ADVENTURE'});},\n    sources(){\n      const files=P.SOURCE_FILES||{},names=Object.keys(files).sort((a,b)=>{const pr=['HANDOFF.md','AGENTS.md','README.md','docs/GAME_DESIGN.md'];return (pr.includes(a)?pr.indexOf(a):-1)\u003c0?((pr.includes(b)?-1:0)\u003c0?1:a.localeCompare(b)):(pr.includes(b)?pr.indexOf(a)-pr.indexOf(b):-1);});\n      if(!files[currentSource])currentSource=names[0];\n      UI.open('소스코드 · 이어서 개발하기','실행 중인 게임의 소스와 기획서를 확인하세요. 개인 저장 데이터는 이 묶음에 포함되지 않아요.',`\u003cdiv class=\"source-layout\">\u003caside class=\"source-files\" aria-label=\"소스 파일 목록\">${names.map(n=>`\u003cbutton data-source=\"${esc(n)}\">${esc(n)}\u003c/button>`).join('')}\u003c/aside>\u003csection class=\"source-code\">\u003cdiv class=\"code-toolbar\">\u003cspan id=\"code-path\">\u003c/span>\u003cdiv>\u003cbutton id=\"copy-file\">내용 복사\u003c/button>\u003cbutton id=\"download-file\">파일 저장\u003c/button>\u003c/div>\u003c/div>\u003cpre id=\"source-pre\" tabindex=\"0\">\u003c/pre>\u003c/section>\u003c/div>\u003cdiv class=\"source-foot\">전체 원본 JS · CSS · SVG · 테스트 · 빌드 도구 · 최종 기획 · 인수인계 문서. 비밀번호나 저장 파일은 포함하지 않습니다.\u003c/div>`,{kind:'source',source:true,eyebrow:'OPEN SOURCE WORKSPACE',actions:'\u003cdiv class=\"source-actions\">\u003cbutton class=\"primary\" id=\"source-zip\">전체 소스 ZIP ↓\u003c/button>\u003cbutton class=\"secondary\" id=\"copy-handoff\">코덱스 전달문 복사\u003c/button>\u003cbutton class=\"secondary\" id=\"open-handoff\">인수인계 문서\u003c/button>\u003c/div>'});\n      const show=name=>{currentSource=name;$('code-path').textContent=name;$('source-pre').textContent=files[name]||'';document.querySelectorAll('[data-source]').forEach(b=>b.classList.toggle('active',b.dataset.source===name));};\n      document.querySelectorAll('[data- eyboard.press('Space');page.wait_for_timeout(100)\n        check('Purchased jump moves player off ground',page.evaluate('PIGGY.game.player.y\u003cPIGGY.CONFIG.ground-20'))\n        fresh(page,False)\n        page.evaluate('''()=>{const P=PIGGY,s=P.state;s.coins=10000;for(const t of P.SKILLS)P.State.purchase(s,'skill',t.id);P.UI.refreshHome();}''')\n        page.locator('#depart').click()\n        values=page.evaluate('''()=>{const P=PIGGY,g=P.game;g.enemies=[];const used={};for(const id of ['spin','dash','fire','fly','gun']){P.state.equipped=[id];g.pig.carrying=false;g.skill(0);used[id]=(g.player.skills[id]||0)>0;}g.player.skills.fire=0;g.pig.carrying=true;P.state.equipped=['fire'];g.skill(0);used.carryBlocked=g.player.skills.fire===0;g.mode='pause';return used;}''')\n        check('All five special actions activate, with hand-use carry restriction',all(values.values()),values)\n        fresh(page)\n        page.evaluate('''()=>{const P=PIGGY,g=P.game;g.progress.dead=['wind-main-0'];P.state.runCoins=37;g.player.hp=61;g.snapshot();}''')\n        seed=page.evaluate('window.__testStore')\n        ctx2,page2=ready(browser,seed=seed)\n        check('Saved expedition restores health, coins and dead enemy record, paused',page2.evaluate(\"PIGGY.state.runCoins===37&&PIGGY.game.player.hp===61&&!PIGGY.game.enemies.some(e=>e.id==='wind-main-0')&&PIGGY.game.mode==='pause'\"),'Memory Storage adapter; not real browser-origin persistence')\n        ctx2.close()\n        fresh(page,False);page.locator('#source-btn').click();page.locator('[data-source=\"src/game.js\"]').click()\n        check('Source viewer shows the exact executing original module',page.locator('#source-pre').inner_text()==(ROOT/'src/game.js').read_text())\n        page.screenshot(path=str(OUT/'source.png'))\n        private_marker=str(uuid.uuid4())\n        page.evaluate(\"v=>PIGGY.state.privateTestMarker=v\",private_marker)\n        with page.expect_download() as d:page.locator('#source-zip').click()\n        zip_path=OUT/'source-download.zip';d.value.save_as(str(zip_path))\n        with zipfile.ZipFile(zip_path) as z:\n            check('Public ZIP passes CRC and includes runnable sources and handoff',z.testzip() is None and all(n in z.namelist() for n in ['index.html','source-bundle.js','src/game.js','scripts/build.py','HANDOFF.md','AGENTS.md','assets/pig.svg']))\n            check('ZIP excludes individual save data',all(private_marker.encode() not in z.read(n) for n in z.namelist()))\n            check('Downloaded game source matches original byte-for-byte',z.read('src/game.js')==(ROOT/'src/game.js').read_bytes())\n        with page.expect_download() as d:page.locator('#download-file').click()\n        d.value.save_as(str(OUT/'game-source-download.js'))\n        check('Per-file download matches visible source',(OUT/'game-source-download.js').read_bytes()==(ROOT/'src/game.js').read_bytes())\n        fresh(page,False);page.locator('#save-tools').click()\n        invalid=json.dumps({'schema':999}).encode()\n        page.locator('#import-save').set_input_files({'name':'bad.json','mimeType':'application/json','buffer':invalid});page.wait_for_timeout(100)\n        check('Unsupported save import leaves current state untouched',page.evaluate('PIGGY.state.coins===120'))\n        new=page.evaluate('PIGGY.State.fresh()');new['coins']=777\n        page.locator('#import-save').set_input_files({'name':'restore.json','mimeType':'application/json','buffer':json.dumps(new).encode()});page.wait_for_selector('#confirm-import')\n        check('Valid save import requests confirmation before replacing data',page.evaluate('PIGGY.state.coins===120'))\n        with page.expect_download() as d:page.locator('#confirm-import').click()\n        d.value.save_as(str(OUT/'before-import-backup.json'))\n        check('Confirmed import backs up old data and restores selected save',page.evaluate('PIGGY.state.coins===777') and json.loads((OUT/'before-import-backup.json').read_text())['coins']==120)\n ,true);assert.equal(b.frontPlanted,true);\n  assert.ok(Math.abs((15+a.frontFoot[0])-(30+b.frontFoot[0]))\u003c1e-6);\n  assert.equal(a.frontFoot[1],0);assert.equal(b.frontFoot[1],0);\n});\ntest('arms rotate at the shoulder and counter-swing the advancing leg',()=>{\n  const a=P.Motion.pose({phase:.125,speed:230}),b=P.Motion.pose({phase:.625,speed:230});\n  for(const phase of [0,.125,.375,.5,.625,.875]){\n    const p=P.Motion.pose({phase,speed:230});\n    assert.ok(p.frontFoot[0]*(p.frontHand[0]-p.shoulder[0])\u003c0);\n  }\n  assert.ok(distance(a.frontElbow,b.frontElbow)>20);\n});\ntest('two punches extend alternating arms without stretching their bones',()=>{\n  const jab=P.Motion.pose({pose:'punch',age:.055}),cross=P.Motion.pose({pose:'punch',age:.215});\n  assert.equal(jab.attackArm,'front');assert.equal(cross.attackArm,'rear');\n  assert.ok(jab.frontHand[0]>60&&cross.rearHand[0]>60);\n  for(const p of [jab,cross,P.Motion.pose({pose:'punch',age:.055,aimY:-34})]){\n    assert.ok(distance(p.shoulder,p.frontHand)\u003c=62.001);assert.ok(distance(p.shoulder,p.rearHand)\u003c=62.001);\n  }\n});\ntest('kick reaches extension in 45ms and retracts with its support foot planted',()=>{\n  const peak=P.Motion.pose({pose:'kick',age:.045}),end=P.Motion.pose({pose:'kick',age:.22});\n  assert.equal(peak.kickExtension,1);assert.ok(end.kickExtension\u003c.001);assert.equal(peak.rearFoot[1],0);\n  for(const h of [-74,-28]){const p=P.Motion.pose({pose:'kick',age:.045,kickAimY:h});assert.ok(distance(p.hip,p.frontFoot)\u003c95.01);}\n});\ntest('all actors stand on the middle of the visible road',()=>{\n  assert.equal(P.CONFIG.ground,(P.CONFIG.roadTop+P.CONFIG.roadBottom)/2);\n});\ntest('scenery preserves feature identity and continuous offsets across a wrap boundary',()=>{\n  for(const speed of [.12,.32,.62,1,1.12]){\n    const a=P.Art.anchors(339,speed,340),b=P.Art.anchors(341,speed,340);\n    for(const item of a){const same=b.find(x=>x.id===item.id);if(same){assert.equal(item.worldX,same.worldX);assert.ok(Math.abs(same.x-item.x+2*speed)\u003c1e-6);}}\n  }\n});\ntest('old completed saves retain progress and unlock the added third map',()=>{\n  const raw=P.State.fresh();delete raw.progress.brook;raw.progress.wind.cleared=true;raw.progress.amber.cleared=true;raw.unlocked=['wind','amber'];raw.coins=333;\n  const s=P.State.normalize(raw);assert.equal(s.coins,333);assert.ok(s.unlocked.includes('brook'));assert.equal(s.progress.brook.cleared,false);\n});\ntest('every map has complete reachable areas and a deepest boss approach',()=>{\n  assert.equal(P.MAPS.length,3);\n  for(const map of P.MAPS){assert.ok(map.rooms.main.bossX\u003cmap.rooms.main.width);const seen=new Set(['main']);\n    for(let pass=0;pass\u003c10;pass++)for(const id of [...seen])for(const p of map.rooms[id].portals){assert.ok(map.rooms[p.target]);assert.ok(p.x>=0&&p.x\u003cmap.rooms[id].width);seen.add(p.target);}\n    assert.equal(seen.size,Object.keys(map.rooms).length);\n    for(const room of Object.values(map.rooms)){assert.ok(room.landmarks.length>=3);for(const enemy of room.enemies)assert.ok(enemy.x>0&&enemy.x\u003croom.width);}\n  }\n});\n","tests/rules.test.cjs":"'use strict';\nconst {test}=require('node:test');\nconst assert=require('node:assert/strict');\nrequire('../src/config.js');require('../src/state.js');require('../src/export.js');\nconst P=globalThis.PIGGY;\n\ntest('new game has 120 safe coins, no risky coins, one companion slot',()=>{const s=P.State.fresh();assert.equal(s.coins,120);assert.equal(s.runCoins,0);assert.equal(s.slots,1);assert.deepEqual(s.party,['sprout']);});\ntest('manual return banks run coins exactly once',()=>{const s=P.State.fresh();s.runCoins=75;s.active=true;const r=P.State.settle(s,'return');assert.equal(s.coins,195);assert.equal(r.kept,75);P.State.settle(s,'return');assert.equal(s.coins,195);});\ntest('player death preserves coins and does not heal',()=>{const s=P.State.fresh();s.player.hp=0;s.runCoins=80;P.State.settle(s,'player-death');assert.equal(s.coins,200);assert.equal(s.player.hp,0);assert.ok(P.State.canDepart(s));});\ntest('pig death loses only risky coins',()=>{const s=P.State.fresh();s.pig.hp=0;s.runCoins=90;const r=P.State.settle(s,'pig-death');assert.equal(s.coins,120);assert.equal(r.lost,90);assert.equal(s.runCoins,0);});\ntest('no departure without at least 1 player HP and 1 pig HP',()=>{const s=P.State.fresh();s.player.hp=.5;assert.ok(P.State.canDepart(s));s.player.hp=1;s.pig.hp=0;assert.ok(P.State.canDepart(s));s.pig.hp=1;assert.equal(P.State.canDepart(s),'');});\ntest('medicine heals 50 and is consumed once',()=>{const s=P.State.fresh();s.player.hp=0;assert.equal(P.State.heal(s,'player','potion'),'');assert.equal(s.player.hp,50);assert.equal(s.inventory.potion,2);});\ntest('full health does not consume medicine',()=>{const s=P.State.fresh();assert.ok(P.State.heal(s,'player','potion'));assert.equal(s.inventory.potion,3);});\ntest('pig requires repair tool, which restores 80',()=>{const s=P.State.fresh();s.pig.hp=0;assert.ok(P.State.heal(s,'pig','potion'));assert.equal(s.inventory.potion,3);assert.equal(P.State.heal(s,'pig','repair'),'');assert.equal(s.pig.hp,80);assert.equal(s.inventory.repair,1);});\ntest('companion returns at 10 simulation seconds with half max HP',()=>{const s=P.State.fresh();s.helpers.sprout={hp:0,revive:10};P.State.reviveTick(s,9.99);assert.equal(s.helpers.sprout.hp,0);P.State.reviveTick(s,.011);assert.equal(s.helpers.sprout.hp,40);});\ntest('pause without simulation ticks never advances revival',()=>{const s=P.State.fresh();s.helpers.sprout={hp:0,revive:10};const paused=JSON.parse(JSON.stringify(s));assert.deepEqual(s,paused);assert.equal(s.helpers.sprout.revive,10);});\ntest('revival uses each helper maximum, not previous HP',()=>{const s=P.State.fresh();s.helpers.shield={hp:0,revive:1};s.party=['shield'];P.State.reviveTick(s,1);assert.equal(s.helpers.shield.hp,75);});\ntest('normalization keeps kill and chest records',()=>{const s=P.State.fresh();s.progress.wind.dead=['wind-main-0'];s.progress.wind.opened=['w-c1'];const restored=P.State.normalize(JSON.parse(JSON.stringify(s)));assert.deepEqual(restored.progress.wind.dead,['wind-main-0']);assert.deepEqual(restored.progress.wind.opened,['w-c1']);});\ntest('invalid IDs, out-of-range values and poisoned keys are not copied',()=>{const raw=JSON.parse('{\"schema\":2,\"coins\":-99,\"slots\":88,\"helpers\":{\"evil\":{\"hp\":999}},\"party\":[\"evil\"],\"skills\":{\"evil\":5},\"__proto__\":{\"polluted\":true}}');const s=P.State.normalize(raw);assert.equal(s.coins,0);assert.equal(s.slots,3);assert.deepEqual(s.party,[]);assert.equal(s.skills.evil,undefined);assert.equal({}.polluted,undefined);});\ntest('unsupported save formats are rejected',()=>{assert.throws(()=>P.State.normalize({schema:99}));assert.throws(()=>P.State.normalize(null));});\ntest('purchases require actual bank balance and respect max level',()=>{const s=P.State.fresh();assert.ok(P.State.purchase(s,'helper','shield'));assert.equal(s.coins,120);s.coins=5000;assert.equal(P.State.purchase(s,'helper','shield'),'');assert.equal(s.coins,4660);assert.ok(P.State.purchase(s,'helper','shield'));s.skills.jump=3;assert.ok(P.State.purchase(s,'skill','jump'));});\ntest('max-health upgrade never heals for free',()=>{const s=P.State.fresh();s.coins=500;s.player.hp=14;assert.equal(P.State.purchase(s,'health'),'');assert.equal(s.player.max,120);assert.equal(s.player.hp,14);});\ntest('utility movement does not occupy special skill slots',()=>{const s=P.State.fresh();s.coins=5000;P.State.purchase(s,'skill','jump');assert.deepEqual(s.equipped,[]);for(const id of ['spin','dash','fire','gun'])P.State.purchase(s,'skill',id);assert.equal(s.equipped.length,3);assert.equal(s.skills.gun,1);});\ntest('every regular monster and chest ID is unique across maps',()=>{const ids=P.MAPS.flatMap(m=>P.allEnemies(m).map(e=>e.id));assert.equal(new Set(ids).size,ids.length);for(const m of P.MAPS)for(const r of Object.values(m.rooms))for(const p of r.portals) <script>
/** Korean interface, shops, home treatment, results and an in-page source workspace. */
(function(P){

    result(r){
      resumeAfter=false;const clear=r.reason==='clear',pig=r.reason==='pig-death',dead=r.reason==='player-death';

      $('result-home').onclick=()=>UI.home();$('result-retry').onclick=()=>{const id=P.game.map.id;UI.home();UI.depart(id,clear);};UI.refreshHome();
    },
    loot(chest){
      let rows='';for(const [id,label] of [['coins','코인'],['potion','치료제'],['repair','수리도구']])if(chest[id])rows+=`<div class="loot-row"><img alt="" src="${asset(id==='coins'?'coin':id)}"><span>${label} <strong>+${chest[id]}</strong></span></div>`;
      UI.open('보물상자를 열었어요','평범한 나무 상자 속 작은 선물. 아이템을 가방에 담았습니다.',`<div class="dialog-content">${rows}<div class="button-row"><button class="primary" id="loot-close">탐험 계속하기</button></div></div>`,{eyebrow:'A LITTLE DISCOVERY'});$('loot-close').onclick=()=>UI.close();
    },
    foundHelper(def){UI.open('새로운 동료, '+esc(def.name),'조수 모음집에 바로 등록했어요. 다음 출발 전에 동행 조수로 선택하세요.',`<div class="dialog-content"><div class="result-hero"><canvas class="helper-image" id="found-art" width="250" height="140"></canvas><h3 style="margin-top:20px">${esc(def.name)}</h3><p>${esc(def.description)}</p></div><div class="button-row"><button id="found-close" class="primary">계속 탐험하기</button></div></div>`,{eyebrow:'HELLO, NEW FRIEND'});UI.drawHelper($('found-art'),def);$('found-close').onclick=()=>UI.close();},
    drawHelper(canvas,def){const c=canvas.getContext('2d');c.clearRect(0,0,canvas.width,canvas.height);c.save();c.translate(canvas.width/2,canvas.height-10);P.Art.stick(c,0,0,{color:def.color,band:'#ccb879',shield:def.id==='shield',scale:Math.min(.74,(canvas.height-20)/184)});c.restore();},
    campOnly(){if(P.state.active){UI.toast('귀환한 뒤 홈에서 정비할 수 있어요.');return false;}return true;},
    helpers(){
      if(!UI.campOnly())return;const s=P.state;
      const cards=P.HELPERS.map(h=>{const owned=!!s.helpers[h.id],selected=s.party.includes(h.id);return `<article class="card"><canvas class="helper-image" data-art="${h.id}" width="250" height="140"></canvas><h3>${h.name}</h3><span class="badge ${selected?'selected':''}">${selected?'동행 중':owned?'보유':h.price===null?'탐험 중 발견':'영입 가능'}</span><p>${h.description}</p><div class="statline">체력 ${owned?Math.ceil(s.helpers[h.id].hp):h.hp} / ${h.hp} · 공격력 ${h.attack}</div>${owned?`<button class="${selected?'secondary':'primary'}" data-party="${h.id}">${selected?'동행 해제':'함께 출발하기'}</button>`:h.price===null?'<button class="secondary" disabled>바람숲의 숨겨진 길에서 만나요</button>':`<button class="primary" data-buy-type="helper" data-id="${h.id}">영입하기 · ${h.price} ◉</button>`}</article>`;}).join('');
      UI.open('조수 모음집','여러 조수를 모으고, 이번 원정에 함께할 동료를 골라주세요.',`<div class="dialog-content"><div class="slotbar">동행 ${s.party.length} / ${s.slots}명 <span class="smallnote"> · 조수는 쓰러진 뒤 10초 후 저금통에서 체력 50%로 부활해요.</span></div><div class="cards two">${cards}</div><div class="stat-footer"><span>조수를 더 많이 데리고 가고 싶나요?</span><button class="secondary" data-buy-type="slots" ${s.slots>=3?'disabled':''}>${s.slots>=3?'최대 3명 개방 완료':'동행 자리 늘리기 · '+(s.slots===1?300:600)+' ◉'}</button></div></div>`,{eyebrow:'YOUR LITTLE EXPEDITION'});
      document.querySelectorAll('[data-art]').forEach(el=>UI.drawHelper(el,P.helperById(el.dataset.art)));
      document.querySelectorAll('[data-party]').forEach(b=>b.onclick=()=>{const id=b.dataset.party;if(s.party.includes(id))s.party=s.party.filter(x=>x!==id);else if(s.party.length<s.slots)s.party.push(id);else{UI.toast('동행 자리가 가득해요. 다른 조수를 해제하거나 자리를 늘리세요.');return;}P.State.save(s);UI.helpers();});
      UI.bindPurchases(()=>UI.helpers());
    },
    bindPurchases(refresh){document.querySelectorAll('[data-buy-type]').forEach(b=>b.onclick=()=>{const err=P.State.purchase(P.state,b.dataset.buyType,b.dataset.id);if(err)UI.toast(err);else{P.State.save(P.state);UI.refreshHome();P.Audio.play('heal');refresh();}});},
    skills(){
      if(!UI.campOnly())return;const s=P.state;
      const cards=P.SKILLS.map(t=>{const level=s.skills[t.id]||0,max=level>=t.max,equipped=s.equipped.includes(t.id),price=Math.round(t.price*(1+level*.7));return `<article class="card"><span class="skill-icon">${t.icon}</span><h3>${t.name}</h3><span class="badge ${equipped?'selected':''}">${level?'단계 '+level+' / '+t.max:'배우지 않음'}${equipped?' · 장착':''}</span><p>${t.description}</p><button class="primary" data-buy-type="skill" data-id="${t.id}" ${max?'disabled':''}>${max?'강화 완료':(level?'강화하기':'배우기')+' · '+price+' ◉'}</button>${level&&!t.utility?`<button class="secondary" data-equip="${t.id}">${equipped?'장착 해제':'기술 장착'}</button>`:''}</article>`;}).join('');
      UI.open('기술 배우기','두 주먹으로 시작한 모험에 새로운 움직임을 더해요. 특수 기술은 3개까지 장착할 수 있어요.',`<div class="dialog-content"><div class="slotbar">기본: 펀치 J · 발차기 K &nbsp; | &nbsp; ${s.skills.jump?'뛰기: 스페이스':'뛰기는 구매 후 사용'}<br><span class="smallnote">장착 순서대로 1 · 2 · 3 키를 사용해요. ${s.equipped.map(id=>P.skillById(id).name).join(' / ')||'아직 장착한 기술이 없어요.'}</span></div><div class="cards">${cards}</div><div class="stat-footer"><span>펀치·발차기 공격력 · 단계 ${s.player.attackLevel}/5</span><button class="secondary" data-buy-type="attack" ${s.player.attackLevel>=5?'disabled':''}>공격력 강화 · ${120+s.player.attackLevel*80} ◉</button></div><div class="stat-footer"><span>플레이어 최대 체력 ${s.player.max} <small>※ 현재 체력은 자동 회복되지 않아요.</small></span><button class="secondary" data-buy-type="health" ${s.player.max>=200?'disabled':''}>최대 체력 +20 · ${180+(s.player.max-100)*4} ◉</button></div></div>`,{eyebrow:'SMALL MOVES, BIG POSSIBILITIES'});
      UI.bindPurchases(()=>UI.skills());document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{const id=b.dataset.equip;if(s.equipped.includes(id))s.equipped=s.equipped.filter(x=>x!==id);else if(s.equipped.length<3)s.equipped.push(id);else{UI.toast('특수 기술은 3개까지 장착할 수 있어요.');return;}P.State.save(s);UI.skills();});
    },
    bag(){
      if(!UI.campOnly())return;const s=P.state;
      const targets=[{id:'player',name:'나의 졸라맨',hp:s.player.hp,max:s.player.max,color:'#294a40'},...P.HELPERS.filter(h=>s.helpers[h.id]).map(h=>({...h,hp:s.helpers[h.id].hp,max:h.hp})),{id:'pig',name:'돼지 저금통',hp:s.pig.hp,max:s.pig.max}];
      const cards=targets.map(h=>`<article class="card heal-target" data-heal-target="${h.id}" tabindex="0" role="button" aria-label="${h.name} 치료하기">${h.id==='pig'?`<img class="art-mini" alt="돼지 저금통" src="${asset('pig')}">`:`<canvas class="helper-image" data-heal-art="${h.id}" width="250" height="140"></canvas>`}<h3>${h.name}</h3><div class="hp-label"><span>현재 체력</span><b>${Math.ceil(h.hp)} / ${h.max}</b></div><progress value="${h.hp}" max="${h.max}" class="${h.id==='pig'?'pink':''}"></progress><p>${h.id==='pig'?'수리도구를 놓으면 체력 +80':'치료제를 놓으면 체력 +50'}</p></article>`).join('');
      const rescue=(s.player.hp<1&&!s.inventory.potion&&s.coins<30)||(s.pig.hp<1&&!s.inventory.repair&&s.coins<45);
      UI.open('가방 · 치료','물건을 캐릭터 위로 끌어다 놓으세요. 물건을 누른 뒤 치료할 대상을 눌러도 됩니다.',`<div class="dialog-content"><div class="bag-items">${[['potion','치료제','체력 +50'],['repair','수리도구','저금통 +80']].map(([id,name,detail])=>`<button class="bag-item ${selectedItem===id?'selected':''}" draggable="true" data-item="${id}"><img alt="" src="${asset(id)}"><span><strong>${name} × ${s.inventory[id]}</strong><small>${detail} · 끌어서 사용</small></span></button>`).join('')}</div><div class="cards">${cards}</div><div class="stat-footer"><span>원정을 위한 작은 준비</span><span><button class="secondary" data-buy-type="item" data-id="potion">치료제 · 30 ◉</button> <button class="secondary" data-buy-type="item" data-id="repair">수리도구 · 45 ◉</button></span></div>${rescue?'<div class="warn">체력과 치료 수단이 모두 없어 출발할 수 없네요. 이 시험판에서는 긴급 보급 1개를 받을 수 있어요. <button class="secondary" id="rescue">긴급 보급 받기</button></div>':''}<p class="smallnote">홈에서 체력이 저절로 회복되지는 않아요. 출전하려면 플레이어와 저금통 체력이 각각 1 이상 필요합니다.</p></div>`,{eyebrow:'REST, REPAIR, RETURN'});
      document.querySelectorAll('[data-heal-art]').forEach(c=>{let h=targets.find(t=>t.id===c.dataset.healArt);UI.drawHelper(c,h);});
      document.querySelectorAll('[data-item]').forEach(b=>{b.onclick=()=>{selectedItem=b.dataset.item;document.querySelectorAll('[data-item]').forEach(x=>x.classList.toggle('selected',x.dataset.item===selectedItem));};b.ondragstart=e=>{selectedItem=b.dataset.item;e.dataTransfer.setData('text/plain',selectedItem);e.dataTransfer.effectAllowed='copy';};
        b.onpointerdown=e=>{if(e.pointerType==='touch'){selectedItem=b.dataset.item;b.setPointerCapture(e.pointerId);}};
        b.onpointerup=e=>{if(e.pointerType==='touch'){const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-heal-target]');if(target){e.preventDefault();UI.doHeal(target.dataset.healTarget,selectedItem);}}};});
      document.querySelectorAll('[data-heal-target]').forEach(c=>{c.ondragover=e=>{e.preventDefault();c.classList.add('drag-over');};c.ondragleave=()=>c.classList.remove('drag-over');c.ondrop=e=>{e.preventDefault();UI.doHeal(c.dataset.healTarget,e.dataTransfer.getData('text/plain'));};c.onclick=()=>UI.doHeal(c.dataset.healTarget,selectedItem);c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();UI.doHeal(c.dataset.healTarget,selectedItem);}};});
      if(rescue)$('rescue').onclick=()=>{if(s.player.hp<1&&!s.inventory.potion&&s.coins<30)s.inventory.potion=1;if(s.pig.hp<1&&!s.inventory.repair&&s.coins<45)s.inventory.repair=1;P.State.save(s);UI.bag();UI.toast('긴급 보급을 가방에 넣었어요. 끌어서 치료하세요.');};
      UI.bindPurchases(()=>UI.bag());
    },
    doHeal(target,item){const error=P.State.heal(P.state,target,item);if(error){UI.toast(error);return;}P.State.save(P.state);P.Audio.play('heal');UI.bag();UI.refreshHome();UI.toast(target==='pig'?'저금통을 수리했어요.':'체력을 회복했어요.');},
    maps(){
      if(!UI.campOnly())return;const s=P.state;
      UI.open('다음 원정은 어디로?','맵마다 진행을 따로 기억해요. 클리어한 맵은 처음부터 다시 도전할 수 있어요.',`<div class="dialog-content"><div class="cards two">${P.MAPS.map(m=>{const p=s.progress[m.id],unlocked=s.unlocked.includes(m.id);return `<article class="card"><span class="skill-icon">${m.tag}</span><h3>${m.name}</h3><span class="badge">${!unlocked?'잠김':p.cleared?'클리어':'진행 중'}</span><p>${m.subtitle}</p><div class="statline">일반 몬스터 ${p.dead.length} / ${P.allEnemies(m).length} · 보스 1마리</div><button class="primary" data-map="${m.id}" ${unlocked?'':'disabled'}>${!unlocked?'앞선 맵을 클리어하세요':p.cleared?'처음부터 다시 플레이':'이 맵 탐험하기'}</button></article>`;}).join('')}</div></div>`,{eyebrow:'CHOOSE YOUR NEXT CHAPTER'});
      document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>{P.state.selectedMap=b.dataset.map;P.State.save(P.state);UI.refreshHome();UI.depart(b.dataset.map,s.progress[b.dataset.map].cleared);});
