      UI.open(g.map.name+' · 탐험 기록','모든 일반 몬스터를 처치하면 가장 깊은 곳의 보스가 나타납니다.',`<div class="dialog-content">${Object.entries(g.map.rooms).map(([id,room])=>{const dead=room.enemies.filter(e=>p.dead.includes(e.id)).length,missing=room.enemies.filter(e=>!p.dead.includes(e.id));return `<section class="world-room"><h3>${p.visited.includes(id)?room.name:'아직 가보지 않은 샛길'} ${id===g.roomId?'· 현재 위치':''}</h3><span class="badge">${dead} / ${room.enemies.length} 처치</span><progress value="${dead}" max="${room.enemies.length}"></progress><p>${missing.length?'남은 적: '+missing.map(e=>Math.round(e.x/room.width*100)+'% 지점').join(' · '):'이 구역을 모두 탐험했어요.'}</p>${id==='main'?'<div class="mini-route"><span>캠프</span><b></b><span>샛길</span><b></b><span>숨겨진 길</span><b></b><span>보스</span></div>':''}</section>`;}).join('')}<p class="smallnote">저금통이 멀어져 이동이 멈추면 돌아가서 E로 들어주세요. 샛길 입구 앞에서 E를 누르면 이동합니다.</p></div>`,{eyebrow:'A MAP OF LITTLE DISCOVERIES'});
    },
    help(){UI.open('작은 원정 안내서','저금통을 데리고 넓은 길을 탐험하는 횡스크롤 모험입니다.',`<div class="dialog-content rules"><section><h3>함께 익힐 조작</h3><table><tr><td>A D / ← →</td><td>좌우 이동 · 휴대전화는 화면 버튼</td></tr><tr><td>J / K</td><td>두 번 펀치 / 밀어내는 발차기<br>재사용 0.5초 / 1초 · 길게 누르면 반복</td></tr><tr><td>E</td><td>저금통 들기·내려놓기 / 상자·샛길·조수와 상호작용</td></tr><tr><td>Q</td><td>조수 따라오기 ↔ 저금통 지키기<br>저금통을 직접 눌러도 전환</td></tr><tr><td>스페이스</td><td>뛰기 · 홈에서 먼저 구매</td></tr><tr><td>1 2 3</td><td>장착한 특수 기술 사용</td></tr><tr><td>ESC / M</td><td>일시정지 / 탐험 기록 보기</td></tr></table></section><section><h3>저금통이 가장 중요해요</h3><p>몬스터가 화면 안에 보이면 다가옵니다. 저금통을 들고 있을 때는 펀치·불 펀치·총을 사용할 수 없어요. 발차기로 길을 열어보세요.</p><p>몬스터가 떨어뜨린 코인 위를 걸으면 코인이 저금통에 들어가고 통통 뛰어요. 홈으로 돌아가거나 플레이어만 쓰러지면 코인을 가져가요. 저금통이 깨지면 이번 원정 코인만 잃어요.</p><p>귀환해도 처치한 몬스터는 다시 나오지 않아요. 샛길까지 모두 정리한 뒤 보스를 잡으면 다음 맵이 열립니다.</p><p>홈에서는 체력이 회복되지 않아요. 치료제와 수리도구를 구입해 끌어다 놓으세요. 조수는 전투 중 10초 뒤 체력 50%로 부활해요.</p><p class="smallnote">현재 그림과 움직임은 원본 벡터·관절 애니메이션을 사용한 시험판입니다. 고급 완성형 애니메이션과 최종 일러스트로 교체할 수 있게 파일을 나눠두었습니다.</p></section></div>`,{eyebrow:'HOW TO ADVENTURE'});},
    sources(){
      const files=P.SOURCE_FILES||{},names=Object.keys(files).sort((a,b)=>{const pr=['HANDOFF.md','AGENTS.md','README.md','docs/GAME_DESIGN.md'];return (pr.includes(a)?pr.indexOf(a):-1)<0?((pr.includes(b)?-1:0)<0?1:a.localeCompare(b)):(pr.includes(b)?pr.indexOf(a)-pr.indexOf(b):-1);});
      if(!files[currentSource])currentSource=names[0];
      UI.open('소스코드 · 이어서 개발하기','실행 중인 게임의 소스와 기획서를 확인하세요. 개인 저장 데이터는 이 묶음에 포함되지 않아요.',`<div class="source-layout"><aside class="source-files" aria-label="소스 파일 목록">${names.map(n=>`<button data-source="${esc(n)}">${esc(n)}</button>`).join('')}</aside><section class="source-code"><div class="code-toolbar"><span id="code-path"></span><div><button id="copy-file">내용 복사</button><button id="download-file">파일 저장</button></div></div><pre id="source-pre" tabindex="0"></pre></section></div><div class="source-foot">전체 원본 JS · CSS · SVG · 테스트 · 빌드 도구 · 최종 기획 · 인수인계 문서. 비밀번호나 저장 파일은 포함하지 않습니다.</div>`,{kind:'source',source:true,eyebrow:'OPEN SOURCE WORKSPACE',actions:'<div class="source-actions"><button class="primary" id="source-zip">전체 소스 ZIP ↓</button><button class="secondary" id="copy-handoff">코덱스 전달문 복사</button><button class="secondary" id="open-handoff">인수인계 문서</button></div>'});
      const show=name=>{currentSource=name;$('code-path').textContent=name;$('source-pre').textContent=files[name]||'';document.querySelectorAll('[data-source]').forEach(b=>b.classList.toggle('active',b.dataset.source===name));};
      document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>show(b.dataset.source));show(currentSource);
      $('source-zip').onclick=()=>P.Export.sourceZip();$('copy-file').onclick=async()=>UI.toast(await P.Export.copy(files[currentSource])?'내용을 복사했어요.':'복사가 제한되어 있어요. 파일 저장을 사용하세요.');
      $('download-file').onclick=()=>P.Export.download(new Blob([files[currentSource]],{type:'text/plain;charset=utf-8'}),currentSource.split('/').pop());
      $('copy-handoff').onclick=async()=>UI.toast(await P.Export.copy(files['CODEX_PROMPT.md']||files['HANDOFF.md'])?'코덱스 전달문을 복사했어요.':'파일 저장으로 전달문을 가져가세요.');$('open-handoff').onclick=()=>show('HANDOFF.md');
    },
    newGame(){
      UI.open('처음부터 시작할까요?','코인, 조수, 기술, 모든 맵의 진행을 초기화합니다. 현재 기록은 먼저 백업 파일로 내려받습니다.',`<div class="dialog-content"><p class="warn">지금까지의 모험을 새 게임으로 바꿉니다. 백업 파일은 저장 관리에서 다시 불러올 수 있어요.</p><div class="button-row"><button class="primary" id="confirm-new-game">백업하고 처음부터 시작</button><button class="secondary" id="cancel-new-game">취소 · 기록 유지</button></div></div>`,{eyebrow:'A BRAND NEW ADVENTURE'});
      $('cancel-new-game').onclick=()=>UI.close();
      $('confirm-new-game').onclick=()=>{
        try{P.Export.download(new Blob([JSON.stringify(P.state,null,2)],{type:'application/json'}),'Piggy_Quest_Before_New_Game.json');}
        catch{UI.toast('백업을 내려받지 못해 기록을 유지했어요.');return;}
        const settings={...P.state.settings};P.state=P.State.fresh();P.state.settings=settings;
        if(!P.State.save(P.state))UI.storageWarning();UI.home();UI.toast('새 원정을 처음부터 시작합니다.');
      };
    },
    saveTools(){
      UI.open('저장 관리','진행 기록은 이 브라우저에만 저장돼요. 다른 기기로 옮기거나 안전하게 보관하려면 파일로 내보내세요.',`<div class="dialog-content"><div class="button-row"><button class="primary" id="export-save">내 저장 파일 내려받기</button><button class="secondary" id="select-import">저장 파일 불러오기</button></div><p class="warn">저장 파일은 소스코드와 별개입니다. 공개 사이트나 공개 저장소에 올리지 마세요. 불러오기는 현재 진행을 교체합니다.</p><label class="checkline"><input id="reduce-motion" type="checkbox" ${P.state.settings.reducedMotion?'checked':''}> 화면 흔들림과 붉은 깜빡임 줄이기</label><p class="smallnote">브라우저 데이터를 지우면 자동 저장도 사라집니다. 다른 탭에서 동시에 플레이하면 마지막 저장이 우선하므로 한 탭에서 사용하세요.</p></div>`,{eyebrow:'KEEP YOUR ADVENTURE SAFE'});
      $('export-save').onclick=()=>{if(P.state.active)P.game.snapshot();P.Export.download(new Blob([JSON.stringify(P.state,null,2)],{type:'application/json'}),'Piggy_Quest_Save.json');};
      $('select-import').onclick=()=>{if(P.state.active){UI.toast('먼저 현재 원정을 귀환한 뒤 저장 파일을 불러오세요.');return;}$('import-save').click();};
      $('reduce-motion').onchange=e=>{P.state.settings.reducedMotion=e.target.checked;P.State.save(P.state);};
    },
    async importSave(file){
      try{if(!file)return;if(file.size>2e6)throw new Error('저장 파일 크기가 너무 큽니다.');const next=P.State.normalize(JSON.parse(await file.text()));
        UI.open('이 기록을 불러올까요?','현재 진행은 불러오기 전 자동 백업 파일로 내려받습니다.',`<div class="dialog-content"><p>보유 코인 ${fmt(next.coins)} · 플레이어 체력 ${Math.ceil(next.player.hp)} / ${next.player.max}</p><div class="button-row"><button class="primary" id="confirm-import">백업하고 불러오기</button><button class="secondary" id="cancel-import">취소</button></div></div>`,{eyebrow:'RESTORE AN ADVENTURE'});
        $('cancel-import').onclick=()=>UI.close();$('confirm-import').onclick=()=>{P.Export.download(new Blob([JSON.stringify(P.state,null,2)],{type:'application/json'}),'Piggy_Quest_Before_Import.json');P.state=next;P.State.save(next);UI.home();if(next.active)UI.restoreActive();UI.toast('저장 기록을 불러왔어요.');};
      }catch(e){UI.toast('저장 파일을 불러오지 못했어요. '+e.message);}finally{$('import-save').value='';}
    },
    renderSkillPad(){$('skills-pad').innerHTML=[0,1,2].map(i=>{const id=P.state.equipped[i],t=P.skillById(id);return `<button data-skill="${i}" aria-label="특수 기술 ${i+1}"><kbd>${i+1}</kbd>${t?t.icon:'+'}<small>${t?t.name:'기술 '+(i+1)}</small></button>`;}).join('');document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>P.game.skill(Number(b.dataset.skill)));},
    updateHUD(){
      const g=P.game;if(g.decorTime-lastHud<.08)return;lastHud=g.decorTime;$('bank-value').textContent=fmt(P.state.coins);
      if(!P.state.active||!g.player)return;const p=g.player,pig=g.pig;
      $('player-health-text').textContent=Math.ceil(p.hp)+' / '+P.state.player.max;$('player-health').max=P.state.player.max;$('player-health').value=p.hp;
      $('pig-health-text').textContent=Math.ceil(pig.hp)+' / '+P.state.pig.max;$('pig-health').max=P.state.pig.max;$('pig-health').value=pig.hp;
      $('room-label').textContent=g.map.name+' · '+g.room.name;$('kill-count').textContent=g.progress.dead.length+' / '+P.allEnemies(g.map).length+' 처치　⌘';
      $('run-coins').textContent=fmt(P.state.runCoins);$('command').innerHTML='● 조수 · '+(P.state.mode==='guard'?'저금통 지키기':'따라오기')+' <kbd>Q</kbd>';
      $('carry-icon').textContent=pig.carrying?'↧':'↥';$('carry-label').textContent=pig.carrying?'내려놓기':'들기 · 사용';
      $('punch-btn').style.opacity=pig.carrying?'.45':'1';$('distance-progress').style.width=(p.x/g.room.width*100)+'%';
      for(const [id,remaining,max] of [['punch-btn',p.punch,.5],['kick-btn',p.kick,1]]){const b=$(id);b.classList.toggle('cooling',remaining>0);b.style.setProperty('--cd',Math.max(0,remaining/max));}
      document.querySelectorAll('[data-skill]').forEach(b=>{let id=P.state.equipped[Number(b.dataset.skill)],t=P.skillById(id),r=p.skills[id]||0;b.classList.toggle('cooling',r>0);b.style.setProperty('--cd',t?r/t.cd:0);});
    },
    init(){
      $('brand').onclick=()=>P.state.active?UI.pause():UI.home();$('source-btn').onclick=()=>UI.sources();$('help').onclick=()=>UI.help();$('save-tools').onclick=()=>UI.saveTools();$('new-game').onclick=()=>UI.newGame();
      $('depart').onclick=()=>UI.depart(P.state.selectedMap,P.state.progress[P.state.selectedMap].cleared);
      $('map-select').onclick=()=>UI.maps();$('world-map').onclick=()=>UI.worldMap();$('pause').onclick=()=>UI.pause();$('command').onclick=()=>P.game.command();
      document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{if(b.dataset.view==='camp'){if(P.state.active)UI.pause();else UI.home();}else UI[b.dataset.view]();});
      document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>P.game[b.dataset.action]());
      $('sound').onclick=()=>{P.Audio.unlock();P.state.settings.sound=!P.state.settings.sound;P.State.save(P.state);UI.refreshHome();P.Audio.play('coin');};
      $('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('stage').requestFullscreen();}catch{UI.toast('이 브라우저에서는 전체 화면 전환이 제한되어 있어요.');}};
      $('modal').addEventListener('cancel',e=>{e.preventDefault();UI.close();});
      $('import-save').onchange=e=>UI.importSave(e.target.files[0]);
      document.querySelectorAll('[data-hold]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();P.Audio.unlock();if(P.game.mode!=='play')return;b.setPointerCapture(e.pointerId);P.game.keys.add(b.dataset.hold);};const release=()=>P.game.keys.delete(b.dataset.hold);b.onpointerup=release;b.onpointercancel=release;b.onlostpointercapture=release;});
      UI.refreshHome();
    }
  };
  P.UI=UI;
})(globalThis.PIGGY = globalThis.PIGGY || {});

</script>
<script>
/** Browser entry and input boundary. */
(async function(P){
  'use strict';
  const loaded=P.State.load();P.state=loaded.state;
  // Preserve unreadable stored bytes; never silently replace the only copy.
  if(loaded.warning){try{const old=localStorage.getItem(P.CONFIG.saveKey);if(old)localStorage.setItem(P.CONFIG.saveKey+'-recovery',old);}catch{}}
  if(!localStorageAvailable())P.state.settings.reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  P.game=new P.Game(document.getElementById('game'));P.UI.init();
  await P.Art.init();document.getElementById('loading').hidden=true;
  if(P.state.active)P.UI.restoreActive();
  else P.UI.home();
  if(loaded.warning)P.UI.toast(loaded.warning);
  window.addEventListener('keydown',e=>{
    if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
    const key=e.key.toLowerCase(),g=P.game;
    if(key==='escape'){e.preventDefault();if(document.getElementById('modal').open)P.UI.close();else if(g.mode==='play')P.UI.pause();else if(g.mode==='pause')P.UI.pause();return;}
    if(g.mode!=='play')return;
    const valid=['a','d','arrowleft','arrowright','j','k','e','q','m',' ','1','2','3'];if(!valid.includes(key))return;
    e.preventDefault();P.Audio.unlock();g.keys.add(key);if(e.repeat)return;
    if(key==='j')g.punch();if(key==='k')g.kick();if(key==='e')g.interact();if(key==='q')g.command();if(key==='m')P.UI.worldMap();if(key===' ')g.jump();if(['1','2','3'].includes(key))g.skill(Number(key)-1);
  });
  window.addEventListener('keyup',e=>P.game.keys.delete(e.key.toLowerCase()));
  function suspend(){P.game.clearInput();if(P.game.mode==='play')P.UI.pause();}
  window.addEventListener('blur',suspend);document.addEventListener('visibilitychange',()=>{if(document.hidden)suspend();});
  window.addEventListener('pagehide',()=>{if(P.state.active)P.game.snapshot();});
  document.getElementById('game').addEventListener('pointerdown',e=>{
    P.Audio.unlock();const g=P.game;if(g.mode!=='play')return;const r=g.canvas.getBoundingClientRect(),scale=Math.min(r.width/1280,r.height/720),left=r.left+(r.width-1280*scale)/2,top=r.top+(r.height-720*scale)/2;
    const x=(e.clientX-left)/scale+g.camera,y=(e.clientY-top)/scale;if(Math.abs(x-g.pig.x)<52&&y>g.pig.y-92&&y<g.pig.y+10)g.command();
  });
  const originalTick=P.game.tick.bind(P.game);P.game.tick=dt=>{if(P.game.mode==='play'){if(P.game.keys.has('j'))P.game.punch();if(P.game.keys.has('k'))P.game.kick();}originalTick(dt);};
  if(location.hash==='#source')P.UI.sources();
  requestAnimationFrame(t=>P.game.frame(t));
  function localStorageAvailable(){try{localStorage.getItem(P.CONFIG.saveKey);return true;}catch{return false;}}
})(globalThis.PIGGY = globalThis.PIGGY || {});

</script>
