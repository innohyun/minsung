<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef0e6"><meta name="description" content="저금통을 지키며 넓은 숲을 탐험하는 졸라맨 액션. 소스코드와 코덱스 인수인계 문서까지 포함된 실행형 프로토타입.">
<title>저금통 원정대 · Piggy Quest</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='50'%3E🐷%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
<header class="site-header">
  <button class="brand" id="brand" aria-label="저금통 원정대 홈"><span class="brand-mark">🐷</span><span><strong>저금통 원정대</strong><small>P I G G Y &nbsp; Q U E S T</small></span></button>
  <nav aria-label="홈 메뉴"><button data-view="camp" class="active">캠프</button><button data-view="helpers">조수 모음집</button><button data-view="skills">기술 배우기</button><button data-view="bag">가방 · 치료</button></nav>
  <div class="header-tools"><span class="bank" title="홈에 안전하게 보관한 코인"><span>◉</span> <b id="bank-value">120</b></span><button class="source-link" id="source-btn"><span>&lt;/&gt;</span> 소스코드</button></div>
</header>
<main>
  <section class="stage" id="stage" aria-label="저금통 원정대 게임 화면">
    <canvas id="game" width="1280" height="720" tabindex="0" aria-label="A D 이동, J 펀치, K 발차기, E 상호작용, Q 조수 명령, ESC 일시정지"></canvas>
    <div class="hero" id="hero">
      <div class="hero-copy"><p class="eyebrow"><span></span> A LITTLE PIG. A BIG ADVENTURE.</p><h1>작은 저금통과<br><em>커다란 모험.</em></h1><p class="lead">길을 찾고. 동료를 만나고. 저금통을 지켜주세요.<br>당신의 첫 번째 원정이 시작됩니다.</p><p class="home-vitals" id="home-vitals"></p><button id="depart" class="primary hero-action">탐험 떠나기 <span>↗</span></button><button class="text-link" data-view="bag">출발 전, 체력을 확인하세요 <span>→</span></button></div>
      <button id="map-select" class="next-map"><b id="map-number">01</b><span><small>NEXT ADVENTURE</small><strong id="map-label">바람숲</strong></span><i>→</i></button>
      <p class="camp-caption">◦ &nbsp; 바람이 머무는 캠프<small>우리의 모험은 여기서부터.</small></p>
      <div class="hero-foot">● 브라우저에 자동 저장 <span>/</span> 로그인 없는 오프라인 모험</div>
    </div>
    <div class="game-ui" id="game-ui" hidden>
      <div class="health-box"><div><span class="health-symbol">◯</span><label>나의 체력 <small id="player-health-text"></small><progress id="player-health" max="100" value="100"></progress></label></div><div><span class="health-symbol">🐷</span><label>저금통 <small id="pig-health-text"></small><progress id="pig-health" class="pink" max="180" value="180"></progress></label></div></div>
      <button class="quest-pill" id="world-map"><strong id="room-label">바람숲 · 큰길</strong><span id="kill-count">0 / 24 처치　⌘</span></button>
      <div class="game-top-right"><div class="run-money"><span>◉</span><label>이번 원정<b id="run-coins">0</b></label></div><button id="pause" class="pause-btn" aria-label="일시정지">☰</button></div>
      <button id="command" class="command-pill">● 조수 · 따라오기 <kbd>Q</kbd></button>
      <div class="movement"><button data-hold="a" aria-label="왼쪽 이동">‹</button><button data-hold="d" aria-label="오른쪽 이동">›</button><button id="jump-btn" data-action="jump" aria-label="뛰기">↟<small>뛰기</small></button></div>
      <div class="skills-pad" id="skills-pad"></div>
      <div class="combat"><button data-action="interact"><kbd>E</kbd><span id="carry-icon">↥</span><small id="carry-label">들기 · 사용</small></button><button data-hold="j" id="punch-btn"><kbd>J</kbd><span>✧</span><small>펀치</small></button><button data-hold="k" id="kick-btn" class="kick"><kbd>K</kbd><span>↗</span><small>발차기</small></button></div>
      <div class="progress-track"><i id="distance-progress"></i></div>
    </div>
    <div id="loading" class="loading"><span class="brand-mark">🐷</span><p>원정 가방을 챙기는 중…</p></div>
  </section>
  <nav class="mobile-nav" aria-label="모바일 홈 메뉴">
    <button data-view="camp" class="active">캠프</button>
    <button data-view="helpers">조수 모음집</button>
    <button data-view="skills">기술 배우기</button>
    <button data-view="bag">가방 · 치료</button>
  </nav>
</main>
<footer><div><span class="live-dot"></span> 원정대 기록 <span class="muted">v0.2.0</span><span class="separator">·</span><button id="help">조작법 · 게임 규칙</button><button id="save-tools">저장 관리</button></div><div class="footer-controls"><span>이동 A D · 펀치 J · 발차기 K · 상호작용 E</span><button id="sound" aria-label="효과음 켜기">♪</button><button id="fullscreen" aria-label="전체 화면">⛶</button></div></footer>
<p class="rotate-hint">휴대전화는 가로로 돌리면 더 넓게 탐험할 수 있어요.</p>
</div>
<dialog id="modal" aria-labelledby="modal-title"><div id="modal-body"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input id="import-save" type="file" accept=".json,application/json" hidden>
<script src="source-bundle.js"></script>
<script src="src/config.js"></script>
<script src="src/state.js"></script>
<script src="src/art.js"></script>
<script src="src/audio.js"></script>
<script src="src/game.js"></script>
<script src="src/export.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
