<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>공 굴리기 연구소 · 맵 저장 자료 확인</title>
  <style>
    body { font: 16px/1.6 system-ui,sans-serif; color:#17324d; background:#e7f2fb; max-width:680px; margin:32px auto; padding:0 18px; }
    main { background:white; padding:24px; border-radius:16px; }
    button,a { font:inherit; } button { padding:12px 16px; border-radius:10px; border:0; background:#2674d9; color:white; cursor:pointer; }
    a { color:#1756a4; } li { margin:8px 0; overflow-wrap:anywhere; } #status { font-weight:700; }
  </style>
</head>
<body>
<main>
  <h1>맵 저장 자료 확인</h1>
  <p>이 화면은 저장 자료를 <strong>읽기만</strong> 합니다. 같은 기기·같은 브라우저에서 이용하세요. 주소의 <strong>http와 https는 서로 다른 저장 공간</strong>입니다.</p>
  <p id="origin"></p>
  <p id="status"></p>
  <ul id="entries"></ul>
  <button id="download" type="button">맵 저장 자료 내려받기</button>
  <p>다운로드한 파일은 원본 확인용입니다. 사이트 데이터 삭제·캐시 초기화·맵 새로 저장은 하지 마세요.</p>
  <p><a id="otherOrigin" href="#">다른 주소의 저장 자료도 확인</a></p>
  <p><a href="./">게임으로 돌아가기</a></p>
</main>
<script>
(() => {
  'use strict';
  const keys=['marble-builder-stages-v1','marble-builder-stages-v1-recovery-v1',
    'marble-builder-creations-v1','marble-builder-creations-v1-recovery-v1',
    'marble-builder-progress-v1'];
  const origin=document.getElementById('origin');
  const status=document.getElementById('status');
  const list=document.getElementById('entries');
  origin.textContent=`현재 저장 공간: ${location.origin}`;
  const other=document.getElementById('otherOrigin');
  other.href=`${location.protocol==='https:'?'http:':'https:'}//${location.host}${location.pathname}`;
  other.textContent=`${location.protocol==='https:'?'http':'https'} 주소의 저장 자료도 확인`;
  let data={origin:location.origin,values:{}};
  try {
    for(const key of keys) {
      const raw=localStorage.getItem(key);
      data.values[key]=raw;
      let count='없음';
      if(raw!==null) {
        try { const parsed=JSON.parse(raw); count=Array.isArray(parsed)?`${parsed.length}개 항목`:'저장됨'; }
        catch { count='원본 있음 (형식 확인 필요)'; }
      }
      const li=document.createElement('li');
      li.textContent=`${key}: ${count}`;
      list.append(li);
    }
    status.textContent='현재 브라우저에 저장된 자료를 확인했습니다.';
  } catch (error) {
    data=null;
    status.textContent='브라우저 저장 공간을 읽을 수 없습니다. 이 기기에서 사용했던 브라우저인지 확인하세요.';
    document.getElementById('download').disabled=true;
  }
  document.getElementById('download').addEventListener('click', () => {
    if(!data) return;
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url; link.download='marble-builder-map-backup.json';
    document.body.append(link); link.click(); link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
  });
})();
</script>
</body>
</html>
