; Copy to EOS.local.ini and replace every REPLACE_* value.
; Build.ps1 -Network EOS merges it into ignored Config/DefaultEngine.ini.
[OnlineSubsystem]
DefaultPlatformService=EOS

[OnlineSubsystemEOS]
bEnabled=true

[/Script/OnlineSubsystemEOS.EOSSettings]
DefaultArtifactName=LastCircle
bUseEAS=true
AuthScopeFlags=1
bUseEOSConnect=true
bUseEOSSessions=true
bUseEOSPresence=false
bEnableOverlay=true
bEnableSocialOverlay=false
+Artifacts=(ArtifactName="LastCircle",ClientId="REPLACE_CLIENT_ID",ClientSecret="REPLACE_CLIENT_SECRET",ProductId="REPLACE_PRODUCT_ID",SandboxId="REPLACE_SANDBOX_ID",DeploymentId="REPLACE_DEPLOYMENT_ID",ClientEncryptionKey="REPLACE_64_HEX_CHAR_KEY")

[/Script/Engine.GameEngine]
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="SocketSubsystemEOS.NetDriverEOS",DriverClassNameFallback="OnlineSubsystemUtils.IpNetDriver")

[/Script/SocketSubsystemEOS.NetDriverEOS]
bIsUsingP2PSockets=true
NetServerMaxTickRate=30
ConnectionTimeout=30.0
InitialConnectTimeout=30.0
