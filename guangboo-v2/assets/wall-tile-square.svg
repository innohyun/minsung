<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <filter id="softShadow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
    <feOffset in="blur" dx="-12" dy="18" result="offset"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="chipShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="1.4" flood-color="#1f120b" flood-opacity="0.35"/></filter>
  <linearGradient id="topGrad" x1="78" y1="58" x2="428" y2="396" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#f0c37b"/>
    <stop offset="0.34" stop-color="#c8874f"/>
    <stop offset="0.72" stop-color="#9e5b36"/>
    <stop offset="1" stop-color="#70402b"/>
  </linearGradient>
  <linearGradient id="frontGrad" x1="94" y1="300" x2="428" y2="474" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#8c5134"/>
    <stop offset="0.48" stop-color="#6c3b2b"/>
    <stop offset="1" stop-color="#41261f"/>
  </linearGradient>
  <linearGradient id="rightGrad" x1="344" y1="136" x2="462" y2="426" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#b07043"/>
    <stop offset="0.45" stop-color="#79432f"/>
    <stop offset="1" stop-color="#2e201d"/>
  </linearGradient>
  <radialGradient id="rim" cx="28%" cy="18%" r="70%"><stop offset="0" stop-color="#fff3bd" stop-opacity="0.52"/><stop offset="0.48" stop-color="#fff3bd" stop-opacity="0.08"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  <pattern id="speckle" width="42" height="42" patternUnits="userSpaceOnUse">
    <circle cx="8" cy="9" r="1.8" fill="#fff1c7" opacity="0.17"/>
    <circle cx="28" cy="17" r="1.2" fill="#2b170f" opacity="0.18"/>
    <circle cx="19" cy="34" r="1.5" fill="#ffd89b" opacity="0.13"/>
    <path d="M34 33 l5 -2" stroke="#2b170f" stroke-width="1.2" opacity="0.12"/>
  </pattern>
  <clipPath id="topClip"><path d="M103 101 Q256 32 409 101 L438 298 Q260 380 75 298 Z"/></clipPath>
  <clipPath id="frontClip"><path d="M75 298 Q260 380 438 298 L404 424 Q259 484 106 424 Z"/></clipPath>
  <clipPath id="rightClip"><path d="M409 101 L438 298 L404 424 L373 206 Z"/></clipPath>
</defs>
<rect width="512" height="512" fill="none"/>
<g filter="url(#softShadow)">
  <ellipse cx="247" cy="415" rx="180" ry="44" fill="#071009" opacity="0.42"/>
  <path d="M75 298 Q260 380 438 298 L404 424 Q259 484 106 424 Z" fill="url(#frontGrad)"/>
  <path d="M409 101 L438 298 L404 424 L373 206 Z" fill="url(#rightGrad)"/>
  <path d="M103 101 Q256 32 409 101 L438 298 Q260 380 75 298 Z" fill="url(#topGrad)"/>
  <path d="M103 101 Q256 32 409 101 L438 298 Q260 380 75 298 Z" fill="url(#rim)"/>
  <path d="M103 101 Q256 32 409 101 L438 298 Q260 380 75 298 Z" fill="url(#speckle)" opacity="0.55" clip-path="url(#topClip)"/>
  <path d="M75 298 Q260 380 438 298 L404 424 Q259 484 106 424 Z" fill="url(#speckle)" opacity="0.38" clip-path="url(#frontClip)"/>
  <path d="M409 101 L438 298 L404 424 L373 206 Z" fill="url(#speckle)" opacity="0.26" clip-path="url(#rightClip)"/>
  <!-- top brick/block seams -->
