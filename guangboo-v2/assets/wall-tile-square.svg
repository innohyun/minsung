  <!-- outer outline -->
  <path d="M103 101 Q256 32 409 101 L438 298 L404 424 Q259 484 106 424 L75 298 Z" fill="none" stroke="#271711" stroke-width="8" stroke-linejoin="round" opacity="0.45"/>
  <path d="M103 101 Q256 32 409 101" fill="none" stroke="#fff0ba" stroke-width="4" stroke-linecap="round" opacity="0.32"/>
  <path d="M75 298 Q260 380 438 298" fill="none" stroke="#28150e" stroke-width="5" opacity="0.36"/>
