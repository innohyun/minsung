    <path d="M101 314 Q259 386 425 314" stroke="#ffc47e" stroke-width="2" opacity="0.18" fill="none"/>
  </g>
  <g clip-path="url(#rightClip)">
    <path d="M417 158 L388 238" stroke="#ffd28b" stroke-width="2" opacity="0.16"/>
    <path d="M427 248 L394 362" stroke="#1f120e" stroke-width="5" opacity="0.22"/>
    <path d="M407 109 L373 206 L404 424" stroke="#fff0b9" stroke-width="2" opacity="0.17" fill="none"/>
  </g>
  <!-- cracks/chips -->
  <g filter="url(#chipShadow)">
    <path d="M229 117 l24 11 l-18 16 l16 20" stroke="#3f261c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.48"/>
    <path d="M230 116 l22 10 l-17 15" stroke="#ffe0a0" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.22"/>
    <path d="M325 242 q28 11 16 37 q-5 11 15 22" stroke="#3f261c" stroke-width="4.2" stroke-linecap="round" fill="none" opacity="0.42"/>
    <path d="M163 330 q25 15 12 36 q-8 13 23 24" stroke="#24140f" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.34"/>
