    <path d="M302 91 q27 -5 45 8 q-22 15 -48 8 z" fill="#fff0b6" opacity="0.15"/>
    <path d="M392 319 q16 8 16 25 q-19 -5 -26 -20 z" fill="#1e1411" opacity="0.24"/>
