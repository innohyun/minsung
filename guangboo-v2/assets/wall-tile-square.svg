    <path d="M334 72 C344 152 352 235 363 326" stroke="#5b3425" stroke-width="3.3" opacity="0.23" fill="none"/>
    <path d="M132 134 C211 163 304 164 383 132" stroke="#ffe1a5" stroke-width="1.6" opacity="0.28" fill="none"/>
    <path d="M180 74 C172 146 165 220 155 326" stroke="#ffe1a5" stroke-width="1.2" opacity="0.2" fill="none"/>
  </g>
